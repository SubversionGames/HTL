                    if (newScore1 > newScore2 + team2TurnsRemaining || newScore2 > newScore1 + team1TurnsRemaining) {
                        setTimeout(() => handleShootoutComplete(newScore1, newScore2), 100);
                        return;
                    }
                }
                
                // Board exhaustion safety net: if this reveal uses up all the answers
                // that can fairly be given (n-1 of an odd-sized board, since the last
                // one would leave the teams with an unequal number of turns; all n of
                // an even-sized board, since both teams have had equal turns), pause
                // here - board and scores stay exactly as they are - until the host
                // clicks the button to actually move on to a new Shootout question.
                const activeShootoutBoard = currentRound === 14
                    ? (selectedTieBreakerShootoutQuestion || (shootoutQuestions.length > 0 ? shootoutQuestions[0] : null))
                    : (selectedShootoutQuestion || (shootoutQuestions.length > 0 ? shootoutQuestions[0] : null));
                if (activeShootoutBoard) {
                    const totalAnswers = activeShootoutBoard.answers.length;
                    const revealedSoFar = shootoutRevealedAnswers.length + 1; // +1 for the one just revealed above
                    const exhaustionThreshold = totalAnswers % 2 === 0 ? totalAnswers : totalAnswers - 1;
                    if (totalAnswers > 0 && revealedSoFar >= exhaustionThreshold) {
                        setShootoutSecondBoardPending(true);
                        return;
                    }
                }
                
                // Switch to next team
                setShootoutActiveTeam(shootoutActiveTeam === 1 ? 2 : 1);
                setTeam1Time(20);
                setTeam2Time(20);
                setTimerRunning(true);
            };
            
            const handleShootoutIncorrect = () => {
                // Calculate new turn count
                const newTurnCount = shootoutActiveTeam === 2 ? shootoutTurnCount + 1 : shootoutTurnCount;
                
                // If switching back to Team 1, increment turn count
                if (shootoutActiveTeam === 2) {
                    setShootoutTurnCount(newTurnCount);
                }
                
                // Check if game should end BEFORE switching teams
                if (newTurnCount >= 5 && shootoutSuddenDeath && shootoutActiveTeam === 2 && bonusScore1 !== bonusScore2) {
                    setTimeout(() => handleShootoutComplete(bonusScore1, bonusScore2), 100);
                    return;
                }
                
                // Check for regular end after 5 turns
                let enteringSuddenDeath = false;
                if (newTurnCount >= 5 && !shootoutSuddenDeath) {
                    if (bonusScore1 !== bonusScore2) {
                        setTimeout(() => handleShootoutComplete(bonusScore1, bonusScore2), 100);
                        return;
                    } else {
                        setShootoutSuddenDeath(true);
                        enteringSuddenDeath = true;
                    }
                }
                
                // Same early-win check as handleShootoutCorrect - a missed answer doesn't
                // change either score, but it does use up a turn, so it can still be the
                // moment the trailing team's chance to catch up runs out.
                if (!shootoutSuddenDeath && !enteringSuddenDeath) {
                    const team1TurnsTaken = shootoutTurnCount + 1;
                    const team2TurnsTaken = newTurnCount;
                    const team1TurnsRemaining = 5 - team1TurnsTaken;
                    const team2TurnsRemaining = 5 - team2TurnsTaken;
                    if (bonusScore1 > bonusScore2 + team2TurnsRemaining || bonusScore2 > bonusScore1 + team1TurnsRemaining) {
                        setTimeout(() => handleShootoutComplete(bonusScore1, bonusScore2), 100);
                        return;
                    }
                }
                
                // Switch to next team without awarding points
                setShootoutActiveTeam(shootoutActiveTeam === 1 ? 2 : 1);
                
                // Reset timers and restart for next turn
                setTeam1Time(20);
                setTeam2Time(20);
                setTimerRunning(true);
            };
            
            const handleShootoutComplete = (finalScore1 = bonusScore1, finalScore2 = bonusScore2) => {
                setTimerRunning(false);
                setShootoutComplete(true);
                
                // Award match points using passed-in scores to avoid stale closure
                if (currentRound === 14) {
                    if (finalScore1 > finalScore2) {
                        setTeam1Score(team1Score + 1);
                    } else {
                        setTeam2Score(team2Score + 1);
                    }
                    const matchScore1 = team1Score + (finalScore1 > finalScore2 ? 1 : 0);
                    const matchScore2 = team2Score + (finalScore2 > finalScore1 ? 1 : 0);
                    const winner = matchScore1 > matchScore2 ? selectedTeam1 : selectedTeam2;
                    setTimeout(() => {
                        setWinnerTeam(winner);
                        setShowWinnerScreen(true);
                    }, 500);
                } else {
                    if (finalScore1 > finalScore2) {
                        setTeam1Score(team1Score + 2);
                    } else {
                        setTeam2Score(team2Score + 2);
                    }
                }
                // Board stays visible - host clicks Next to move on
            };

            // Use selected match data
            const rounds = selectedMatch ? selectedMatch.rounds : [];

            // Bonus and tiebreaker data now comes from Google Sheets state variables
            // closestToQuestions is already loaded as state from the Sheets fetch
            // shootoutQuestions is already loaded as state from the Sheets fetch
            const closestToSeries = (() => {
                if (!closestToQuestions.length) return [];
                const b = closestToBase % closestToQuestions.length;
                const r = closestToQuestions.slice(b).concat(closestToQuestions.slice(0, b));
                return r.concat(r);
            })();
            const legacyClosestToQuestions = closestToSeries;
            // Bottoms Up / Shootout questions are assigned when the round starts (never a default 'first one' and never the bonus's question again)
            const shootoutQuestion = selectedShootoutQuestion || null;
            // Tiebreaker uses the NEXT 5 questions (6-10), so it never repeats the bonus round's questions
            const tieBreakerClosestToQuestions = closestToSeries;
            const tieBreakerShootoutQuestion = selectedTieBreakerShootoutQuestion || null;
            // Active Bottoms Up question - uses tiebreaker version for round 14
            const activeBottomsUpQuestion = currentRound === 14 ? tieBreakerBottomsUpQuestion : bottomsUpQuestion;

            // Same idea as Shootout's shootoutBoxExpanded: once the question is revealed, the whole
            // Question Display Area box grows a bit taller (animated, same as Shootout does) so the
            // answer input has proper room inside the box, underneath the question - instead of
            // floating outside/below it. Unlike the earlier version of this, we do NOT tie this to
            // bottomsUpPhase === 'input' anymore - that phase comes and goes on EVERY turn (each of
            // the 5 turns per team cycles through 'ready' -> 'input' -> 'modal'/'animating' ->
            // 'between'), which made the box grow and shrink over and over across a single round.
            // Instead we key off bottomsUpPhase !== 'question': 'question' is only ever the phase
            // before the round's question has been revealed AND the phase handleBottomsUpComplete()
            // resets back to once the ENTIRE round (all turns, both teams) is finished. So the box
            // now grows exactly once when the question is revealed and shrinks exactly once when the
            // whole round ends - never in between. bottomsUpPhase is already synced between Host and
            // Stream via Firebase, so both screens grow/shrink the box at the same moment without
            // needing a new synced flag of their own.
            const bottomsUpBoxExpanded = (currentRound === 7 || currentRound === 14) && (currentRound === 7 ? bonusType : tieBreakerType) === 'bottomsUp' && bottomsUpPhase !== 'question';

            // ═══════════════════════════════════════════════════════════════════════════
            // HOST SAFETY NETS + LIVE QUESTION REFRESH
            // ═══════════════════════════════════════════════════════════════════════════
            const isBottomsUpRound = (currentRound === 7 || currentRound === 14) && (currentRound === 7 ? bonusType : tieBreakerType) === 'bottomsUp';
            const bottomsUpQuestionMissing = userMode === 'host' && gameStarted && isBottomsUpRound && !activeBottomsUpQuestion;
            const isShootoutRound = (currentRound === 7 || currentRound === 14) && (currentRound === 7 ? bonusType : tieBreakerType) === 'shootout';
            const shootoutQuestionMissing = userMode === 'host' && gameStarted && isShootoutRound && !(currentRound === 14 ? tieBreakerShootoutQuestion : shootoutQuestion);
            const roundQuestionMissing = bottomsUpQuestionMissing || shootoutQuestionMissing;

            // Always-current copies of values that timers and network calls (which started a moment
            // ago) need - otherwise they'd be looking at old values from when they started.
            const liveRefreshCtxRef = React.useRef({});
            liveRefreshCtxRef.current = {
                selectedMatch, bonusType, tieBreakerType, currentRound, bottomsUpPhase,
                closestToQuestions, shootoutQuestions, selectedShootoutQuestion, selectedTieBreakerShootoutQuestion,
                shootoutShuffledAnswers, bottomsUpQuestions, bottomsUpQuestion, tieBreakerBottomsUpQuestion
            };
            const sheetsRefreshingRef = React.useRef(false);
            const finishBottomsUpRoundRef = React.useRef(null);
            finishBottomsUpRoundRef.current = finishBottomsUpRound;

            // Compares two pieces of data ignoring null fields (Firebase quietly drops null fields
            // when it saves, so a question that came back from Firebase would otherwise always look
            // "different" from the same question freshly read from the sheet).
            const sameData = (a, b) => {
                const clean = (k, v) => (v === null ? undefined : v);
                return JSON.stringify(a, clean) === JSON.stringify(b, clean);
            };

            // Re-reads the Google Sheet and quietly updates the questions that are already in the game
            // (the loaded match's rounds, plus whichever bonus/tiebreaker tabs this match uses) so a
            // fix made in the sheet - a spelling error, say - goes live on Host and Stream right away,
            // without reloading or restarting the match. It only reads the tabs it needs (a few small
            // requests), never reshuffles anything, and leaves things alone that would scramble a round
            // already in play (rows added/removed mid-round).
            const refreshLiveQuestions = async () => {
                if (sheetsRefreshingRef.current) return;
                // The very first load never finished (e.g. internet was down) - do a full load instead.
                if (!sheetTabsRef.current) { fetchSheetsData(); return; }
                sheetsRefreshingRef.current = true;
                setSheetsRefreshing(true);
                try {
                    const tabs = sheetTabsRef.current;
                    const start = liveRefreshCtxRef.current;
                    const matchId = start.selectedMatch?.id;
                    const readTab = async (tabName, range) => {
                        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(tabName)}!${range}?key=${SHEETS_API_KEY}`;
                        const res = await fetch(url);
                        if (!res.ok) throw new Error(`Google Sheets answered with an error (${res.status})`);
                        const data = await res.json();
                        return data.values || [];
                    };

                    // Only the tabs this match actually uses
                    const wantTypes = new Set([start.bonusType, start.tieBreakerType].filter(Boolean));
                    const jobs = {};
                    if (matchId && tabs.matchTabs.includes(matchId)) jobs.match = readTab(matchId, 'A2:F25');
                    if (wantTypes.has('closestTo') && tabs.closestToTab) jobs.closestTo = readTab(tabs.closestToTab, 'A2:C1000');
                    if (wantTypes.has('shootout') && tabs.shootoutTab) jobs.shootout = readTab(tabs.shootoutTab, 'A1:Z200');
                    if (wantTypes.has('bottomsUp') && tabs.bottomsUpTab) jobs.bottomsUp = readTab(tabs.bottomsUpTab, 'A1:Z200');
                    const keys = Object.keys(jobs);
                    const results = await Promise.all(keys.map(k => jobs[k]));
                    const rowsByKey = {};
                    keys.forEach((k, i) => { rowsByKey[k] = results[i]; });

                    // Re-read the latest game values now that the network calls are done
                    const ctx = liveRefreshCtxRef.current;
                    const changed = [];
                    const notes = [];

                    // ── Regular match questions ──
                    if (rowsByKey.match && ctx.selectedMatch && ctx.selectedMatch.id === matchId) {
                        const rounds = parseMatchRows(rowsByKey.match);
                        const cur = ctx.selectedMatch;
                        if (rounds.length !== (cur.rounds || []).length) {
                            notes.push('rounds were added/removed in the sheet - not applied mid-match');
                        } else if (!sameData(rounds, cur.rounds)) {
                            setSelectedMatch(prev => (prev && prev.id === matchId) ? { ...prev, rounds } : prev);
                            setSheetsMatches(prev => prev.map(m => m.id === matchId ? { ...m, rounds } : m));
                            changed.push('match questions');
                        }
                    }

                    // ── Closest To (keeps the shuffled order; only updates text/answers in place) ──
                    if (rowsByKey.closestTo) {
                        const fresh = parseClosestToRows(rowsByKey.closestTo);
                        const cur = ctx.closestToQuestions || [];
                        if (cur.length === 0) {
                            if (fresh.length > 0) {
                                setClosestToQuestions([...fresh].sort(() => Math.random() - 0.5));
                                changed.push('Closest To questions');
                            }
                        } else {
                            const byRow = {};
                            fresh.forEach(q => { byRow[q.rowIndex] = q; });
                            const needsUpdate = cur.some(q => { const f = byRow[q.rowIndex]; return f && (f.question !== q.question || !Object.is(f.answer, q.answer)); });
                            // Rows ADDED to the tab since the list was loaded go on the END (shuffled among themselves), so the
                            // order of questions already asked/queued never changes and nothing already used can come back.
                            const have = new Set(cur.map(q => q.rowIndex));
                            const added = fresh.filter(q => !have.has(q.rowIndex)).sort(() => Math.random() - 0.5);
                            if (needsUpdate || added.length > 0) {
                                setClosestToQuestions(prev => prev.map(q => { const f = byRow[q.rowIndex]; return f ? { ...q, question: f.question, answer: f.answer } : q; }).concat(added));
                                if (needsUpdate) changed.push('Closest To question');
                                if (added.length > 0) changed.push(added.length + ' new Closest To question' + (added.length > 1 ? 's' : ''));
                            }
                        }
                    }

                    // ── Shootout ──
                    if (rowsByKey.shootout) {
                        const fresh = parseShootoutRows(rowsByKey.shootout);
                        const mergeShootout = (sel) => {
                            if (!sel) return sel;
                            const f = fresh.find(q => q.colIndex === sel.colIndex);
                            if (!f) return sel;
                            // Same number of answers = a pure edit (typo fix etc.), safe to apply live. A
                            // different number means rows were added/removed, which would scramble a board
                            // that's already in play, so only the question wording is applied.
                            const sameShape = Array.isArray(sel.answers) && sel.answers.length === f.answers.length;
                            if (!sameShape) notes.push('Shootout answers were added/removed - answers not changed mid-match');
                            return { ...sel, longQuestion: f.longQuestion, shortQuestion: f.shortQuestion, answers: sameShape ? f.answers : sel.answers };
                        };
                        if (!sameData(fresh, ctx.shootoutQuestions)) setShootoutQuestions(fresh);
                        const newSel = mergeShootout(ctx.selectedShootoutQuestion);
                        const newTie = mergeShootout(ctx.selectedTieBreakerShootoutQuestion);
                        if (!sameData(newSel, ctx.selectedShootoutQuestion)) { setSelectedShootoutQuestion(newSel); changed.push('Shootout question'); }
                        if (!sameData(newTie, ctx.selectedTieBreakerShootoutQuestion)) { setSelectedTieBreakerShootoutQuestion(newTie); changed.push('Tiebreaker Shootout question'); }
                        // The board shows a shuffled copy of the answers, each tagged with its original
                        // position. Update the wording inside that copy in place, so nothing moves.
                        const activeQ = ctx.currentRound === 14 ? (newTie || fresh[0]) : (newSel || fresh[0]);
                        const activeAnswers = activeQ && activeQ.answers;
                        if (activeAnswers && ctx.shootoutShuffledAnswers.length === activeAnswers.length &&
                            ctx.shootoutShuffledAnswers.some(item => activeAnswers[item.originalIndex] !== undefined && activeAnswers[item.originalIndex] !== item.answer)) {
                            setShootoutShuffledAnswers(prev => prev.length === activeAnswers.length
                                ? prev.map(item => ({ ...item, answer: activeAnswers[item.originalIndex] ?? item.answer }))
                                : prev);
                            if (!changed.includes('Shootout question')) changed.push('Shootout answers');
                        }
                    }

                    // ── Bottoms Up ──
                    if (rowsByKey.bottomsUp) {
                        const fresh = parseBottomsUpRows(rowsByKey.bottomsUp);
                        const roundUnderway = ctx.bottomsUpPhase !== 'question';
                        const shapeOf = (q) => (q.answers || []).map(a => `${a.rowIndex}:${a.pointValue}`).join('|');
                        const mergeBottomsUp = (sel) => {
                            if (!sel) return sel;
                            const f = fresh.find(q => q.colIndex === sel.colIndex);
                            if (!f) return sel;
                            // Round already underway and the answer list changed shape (rows added/removed/
                            // re-ranked): keep the old answers so points and "already used" answers stay
                            // consistent - but still apply the new question wording.
                            if (roundUnderway && shapeOf(f) !== shapeOf(sel)) {
                                notes.push('Bottoms Up answers were added/removed/re-ordered - answers not changed mid-round');
                                return { ...sel, questionText: f.questionText };
                            }
                            return f;
                        };
                        if (!sameData(fresh, ctx.bottomsUpQuestions)) setBottomsUpQuestions(fresh);
                        const newBU = mergeBottomsUp(ctx.bottomsUpQuestion);
                        const newTieBU = mergeBottomsUp(ctx.tieBreakerBottomsUpQuestion);
                        if (!sameData(newBU, ctx.bottomsUpQuestion)) { setBottomsUpQuestion(newBU); changed.push('Bottoms Up question'); }
                        if (!sameData(newTieBU, ctx.tieBreakerBottomsUpQuestion)) { setTieBreakerBottomsUpQuestion(newTieBU); changed.push('Tiebreaker Bottoms Up question'); }
                    }

                    setLastSheetsRefresh({ time: Date.now(), ok: true, changed, note: notes[0] || '' });
                } catch (error) {
                    console.warn('Live question refresh failed:', error);
                    setLastSheetsRefresh(prev => ({ time: prev?.time ?? null, ok: false, changed: [], note: error.message }));
                } finally {
                    sheetsRefreshingRef.current = false;
                    setSheetsRefreshing(false);
                }
            };
            const refreshLiveQuestionsRef = React.useRef(null);
            refreshLiveQuestionsRef.current = refreshLiveQuestions;

            // Host: check the sheet for edits every 30 seconds while a match is running
            useEffect(() => {
                if (userMode !== 'host' || !gameStarted) return;
                const interval = setInterval(() => { if (refreshLiveQuestionsRef.current) refreshLiveQuestionsRef.current(); }, 30000);
                return () => clearInterval(interval);
            }, [userMode, gameStarted]);

            // Keeps the "synced Xs ago" label ticking over
            const [, setSyncClockTick] = useState(0);
            useEffect(() => {
                if (userMode !== 'host' || !gameStarted) return;
                const interval = setInterval(() => setSyncClockTick(t => t + 1), 10000);
                return () => clearInterval(interval);
            }, [userMode, gameStarted]);

            // Host: when a Bottoms Up or Shootout round starts, pick its question from the ones this series has NOT used yet
            // (bonus, tiebreaker and Shootout second boards all count as used). If nothing unused is left the round is blocked
            // (red banner, REVEAL QUESTION refuses) and the sheet is re-checked every 8 seconds until a new question is added.
            useEffect(() => {
                if (userMode !== 'host' || !gameStarted) return;
                if (currentRound !== 7 && currentRound !== 14) return;
                const type = currentRound === 7 ? bonusType : tieBreakerType;
                if (type === 'bottomsUp') {
                    const have = currentRound === 14 ? tieBreakerBottomsUpQuestion : bottomsUpQuestion;
                    if (have) { if (!usedBottomsUpTexts.includes(have.questionText)) setUsedBottomsUpTexts(prev => [...prev, have.questionText]); return; }
                    const pool = bottomsUpQuestions.filter(q => !usedBottomsUpTexts.includes(q.questionText));
                    if (pool.length > 0) {
                        const pick = pool[Math.floor(Math.random() * pool.length)];
                        if (currentRound === 14) setTieBreakerBottomsUpQuestion(pick); else setBottomsUpQuestion(pick);
                        setUsedBottomsUpTexts(prev => [...prev, pick.questionText]);
                        return;
                    }
                } else if (type === 'shootout') {
                    const have = currentRound === 14 ? selectedTieBreakerShootoutQuestion : selectedShootoutQuestion;
                    if (have) { if (!usedShootoutColIndices.includes(have.colIndex)) setUsedShootoutColIndices(prev => [...prev, have.colIndex]); return; }
                    const pool = shootoutQuestions.filter(q => !usedShootoutColIndices.includes(q.colIndex));
                    if (pool.length > 0) {
                        const pick = pool[Math.floor(Math.random() * pool.length)];
                        if (currentRound === 14) setSelectedTieBreakerShootoutQuestion(pick); else setSelectedShootoutQuestion(pick);
                        setUsedShootoutColIndices(prev => [...prev, pick.colIndex]);
                        return;
                    }
                } else return;
                const retry = setTimeout(() => { if (refreshLiveQuestionsRef.current) refreshLiveQuestionsRef.current(); }, 8000);
                return () => clearTimeout(retry);
            }, [userMode, gameStarted, currentRound, bonusType, tieBreakerType, bottomsUpQuestion, tieBreakerBottomsUpQuestion, selectedShootoutQuestion, selectedTieBreakerShootoutQuestion, bottomsUpQuestions, shootoutQuestions, usedBottomsUpTexts, usedShootoutColIndices, sheetsRefreshing]);

            // Closest To: as soon as BOTH teams have submitted, the timers stop
            useEffect(() => {
                if (userMode !== 'host') return;
                const active = currentRound === 7 ? bonusType : currentRound === 14 ? tieBreakerType : null;
                if (active === 'closestTo' && team1GuessSubmitted && team2GuessSubmitted && timerRunning) setTimerRunning(false);
            }, [userMode, currentRound, bonusType, tieBreakerType, team1GuessSubmitted, team2GuessSubmitted, timerRunning]);

            // Host: red warning banner clears itself after a while
            useEffect(() => {
                if (!hostWarning) return;
                const t = setTimeout(() => setHostWarning(''), 12000);
                return () => clearTimeout(t);
            }, [hostWarning]);

            // "Out of reach": during the 'between' phase of a Bottoms Up round, work out whether one team
            // can no longer even tie. Nothing is awarded automatically - Host and Stream both show a notice
            // and the host presses a confirm button (which runs handleBottomsUpNextTurn -> finishBottomsUpRound).
            const bottomsUpClinchWinnerNow = (isBottomsUpRound && bottomsUpPhase === 'between')
                ? getBottomsUpClinchWinner({
                    score1: bonusScore1, score2: bonusScore2,
                    turnNumber: bottomsUpTurnNumber, teamJustWent: bottomsUpActiveTeam,
                    usedValues: bottomsUpUsedAnswers, answers: activeBottomsUpQuestion?.answers
                })
                : null;

            // ---------- Session / playoff helpers (derived every render) ----------
            const matchesNeededToWin = Math.floor(totalMatches / 2) + 1;
            const winsFor = (team) => (team && seriesWins[team.id]) || 0;
            const seriesOver = totalMatches <= 1
                || winsFor(selectedTeam1) >= matchesNeededToWin
                || winsFor(selectedTeam2) >= matchesNeededToWin
                || seriesMatchIndex + 1 >= totalMatches;

            // Multi-match sessions: the HTL logo fades back and shows "GAME n" with the series count (e.g. 1 - 0)
            const seriesLogoOpacity = totalMatches > 1 ? 0.3 : 1;
            const seriesBadge = totalMatches > 1 ? (
                <div className="absolute flex flex-col items-center justify-center text-center font-black text-white" style={{
                    left: '50%', top: '50%', transform: 'translate(-50%, -50%)', zIndex: 5, pointerEvents: 'none',
                    WebkitTextStroke: '5px black', paintOrder: 'stroke fill', textShadow: '0 6px 24px rgba(0,0,0,0.8)', lineHeight: 1.05
                }}>
                    <div style={{fontSize: '120px'}}>GAME {seriesMatchIndex + 1}</div>
                    <div style={{fontSize: '170px'}}>{winsFor(selectedTeam1)} - {winsFor(selectedTeam2)}</div>
                </div>
            ) : null;

            // PLAYOFFS ONLY: has one team fallen out of reach? A team is out of reach when even winning every
            // remaining question (plus its unused Point Doubler, plus the 2-point bonus if it hasn't been played)
            // could not get it level with the leader - a tie would still go to the tiebreaker, so only
            // "cannot even tie" counts. Only checked between questions, never mid-question.
            const playoffClinchWinner = (() => {
                if (seasonType !== 'playoff' || !gameStarted || showWinnerScreen || isTieBreaker) return null;
                if (currentRound >= 14) return null;
                // Only "at rest": nothing revealed yet for the next question (so the notice never covers a question or answer)
                const atRest = !showQuestion && !showAnswer && (currentRound !== 7 || (!showCategory && bonusScore1 === 0 && bonusScore2 === 0
                    && bonusQuestionIndex === 0 && bottomsUpPhase === 'question' && !shootoutBoardRevealed));
                if (!atRest) return null;
                const roundsDone = currentRound <= 7 ? currentRound - 1 : currentRound - 2;   // regular rounds finished (bonus excluded)
                const played = roundsDone * 2 + (currentQuestion - 1);
                const remaining = Math.max(0, 24 - played);
                const bonusLeft = currentRound <= 7 ? 2 : 0;
                const doubler = (pw, active) => (pw && pw.pointDoubler ? 1 : 0) + (active ? 1 : 0);
                const max1 = team1Score + remaining + bonusLeft + doubler(team1Powerups, team1DoublerActive);
                const max2 = team2Score + remaining + bonusLeft + doubler(team2Powerups, team2DoublerActive);
                if (team1Score > max2) return 1;
                if (team2Score > max1) return 2;
                return null;
            })();

            // HOST ONLY: plain-language line about the score situation (all matches, regular rounds only)
            const catchUpInfo = (() => {
                if (!gameStarted || showWinnerScreen || isTieBreaker || currentRound >= 14) return null;
                const roundsDone = currentRound <= 7 ? currentRound - 1 : currentRound - 2;
                const played = roundsDone * 2 + (currentQuestion - 1);
                const remaining = Math.max(0, 24 - played);
                const bonusLeft = currentRound <= 7 ? 2 : 0;
                // Each team can double one question (+1 point each) if it hasn't used its doubler yet (or has it active right now)
                const dbl1 = (team1Powerups.pointDoubler || team1DoublerActive) ? 1 : 0;
                const dbl2 = (team2Powerups.pointDoubler || team2DoublerActive) ? 1 : 0;
                const available = remaining + bonusLeft + dbl1 + dbl2;   // 24 + 2 + 1 + 1 = 28 before any answers
                const diff = Math.abs(team1Score - team2Score);
                if (diff === 0) return `Tied  -  ${available} points still available`;
                const trailer = team1Score < team2Score ? selectedTeam1 : selectedTeam2;
                const trailDbl = team1Score < team2Score ? dbl1 : dbl2;
                // the trailing team can only win the questions + bonus + its OWN doubler (not the leader's)
                const trailerMax = remaining + bonusLeft + trailDbl;
                if (diff > trailerMax) return `${trailer?.name} trails by ${diff}  -  only ${available} points left (out of reach)`;
                return `${trailer?.name} trails by ${diff} (needs ${diff} to tie)  -  ${available} points still available`;
            })();

            // The faint "Version Update" stamp (bottom-right) is for Host / Main screens only - never the Stream
            useEffect(() => {
                const el = document.getElementById('htl-version');
                if (el) el.style.display = userMode === 'stream' ? 'none' : 'block';
            }, [userMode]);

            // Load the shared seeds (Championship / Chump + seed number) once for the host. Falls back to the
            // copy saved in this browser if the shared database can't be read.
            useEffect(() => {
                if (userMode !== 'host') return;
                let cancelled = false;
                try {
                    const local = JSON.parse(localStorage.getItem('htlLeagueSeeds') || 'null');
                    if (local && typeof local === 'object') setLeagueSeeds(local);
                } catch (e) {}
                try {
                    const apply = (v) => {
                        if (!cancelled && v && typeof v === 'object') {
                            setLeagueSeeds(v);
                            try { localStorage.setItem('htlLeagueSeeds', JSON.stringify(v)); } catch (e) {}
                            return true;
                        }
                        return false;
                    };
                    database.ref('leagueSeeds').once('value').then((snap) => {
                        if (apply(snap.val())) return;
                        return database.ref('rooms/_leagueSeeds/seeds').once('value').then((s2) => { apply(s2.val()); });
                    }).catch(() => {
                        database.ref('rooms/_leagueSeeds/seeds').once('value').then((s2) => { apply(s2.val()); }).catch(() => {});
                    });
                } catch (e) {}
                return () => { cancelled = true; };
            }, [userMode]);

            // Count each match's winner exactly once (works for every way a match can end).
            useEffect(() => {
                if (userMode !== 'host' || !showWinnerScreen || !winnerTeam) return;
                if (seriesRecorded.includes(seriesMatchIndex)) return;
                setSeriesRecorded(prev => prev.includes(seriesMatchIndex) ? prev : [...prev, seriesMatchIndex]);
                setSeriesWins(prev => ({ ...prev, [winnerTeam.id]: (prev[winnerTeam.id] || 0) + 1 }));
            }, [userMode, showWinnerScreen, winnerTeam, seriesMatchIndex, seriesRecorded]);

            // Keep the saved setups for every match in the room (so Rejoin as Host can restore them).
            // Kept in its own place in the database, written only when it changes.
            useEffect(() => {
                if (userMode !== 'host' || !roomCode || !gameStarted) return;
                if (seriesMatches.length === 0) return;
                try {
                    database.ref(`rooms/${roomCode}/series`).set(JSON.parse(JSON.stringify({ configs: seriesMatches, order: seriesOrder })));
                } catch (e) {}
            }, [userMode, roomCode, gameStarted, seriesMatches, seriesOrder]);

            // Shuffle shootout answers when match is selected - also re-shuffles
            // whenever a different Shootout question gets selected mid-match (e.g.
            // a second-board swap after the first board runs out of answers),
            // otherwise the board keeps showing the PREVIOUS question's answers.
            useEffect(() => {
                const activeShootoutQuestion = currentRound === 14 ? tieBreakerShootoutQuestion : shootoutQuestion;
                if (activeShootoutQuestion && activeShootoutQuestion.answers) {
                    const shuffled = [...activeShootoutQuestion.answers]
                        .map((answer, index) => ({ answer, originalIndex: index }))
                        .sort(() => Math.random() - 0.5);
                    setShootoutShuffledAnswers(shuffled);
                }
            }, [selectedMatch?.id, currentRound, selectedShootoutQuestion?.colIndex, selectedTieBreakerShootoutQuestion?.colIndex]);

            // Host-only sorted view of the Shootout answers (numeric or alphabetical, filled row by row).
            // This is ONLY used for what the Host screen displays - shootoutShuffledAnswers (above) is left
            // completely alone, so the Stream screen keeps showing the random shuffled order it always has,
            // and players still can't guess an answer's location.
            const shootoutSortedAnswers = React.useMemo(() => {
                return [...shootoutShuffledAnswers].sort((a, b) => {
                    const aStr = String(a.answer).trim();
                    const bStr = String(b.answer).trim();
                    const aNum = parseFloat(aStr.replace(/[^0-9.\-]/g, ''));
                    const bNum = parseFloat(bStr.replace(/[^0-9.\-]/g, ''));
                    const aIsNumeric = /^[\-$]?[\d,]*\.?\d+/.test(aStr) && !isNaN(aNum);
                    const bIsNumeric = /^[\-$]?[\d,]*\.?\d+/.test(bStr) && !isNaN(bNum);
                    if (aIsNumeric && bIsNumeric) return aNum - bNum;
                    return aStr.localeCompare(bStr, undefined, { numeric: true, sensitivity: 'base' });
                });
            }, [shootoutShuffledAnswers]);

            // Adjust index for rounds after bonus (round 8+ uses index 6+)
            const getRoundIndex = () => {
                if (currentRound < 7) return currentRound - 1; // Rounds 1-6 use index 0-5
                if (currentRound > 7 && currentRound <= 13) return currentRound - 2; // Rounds 8-13 use index 6-11
                return null; // Bonus or tie-breaker
            };
            
            const roundIndex = getRoundIndex();
            const currentRoundData = roundIndex !== null ? rounds[roundIndex] : null;
            const currentQuestionText = currentRoundData ? (currentQuestion === 1 ? currentRoundData.question1 : currentRoundData.question2) : '';
            const currentQuestionDisplay = renderQuestionText(currentQuestionText, userMode === 'host');
            const currentAnswerText = currentRoundData ? (currentQuestion === 1 ? currentRoundData.answer1 : currentRoundData.answer2) : '';

            // "Does <deciding team> want to go first or second?" (playoffs, host only)
            const positionDecider = showPositionModal ? getPositionDecider(positionModalFor) : null;
            const positionModalJSX = (showPositionModal && userMode === 'host' && positionDecider) ? (
                <div className="absolute inset-0 flex items-center justify-center" style={{backgroundColor: 'rgba(0,0,0,0.85)', zIndex: 10000}}>
                    <div className="bg-gray-900 rounded-3xl border-8 text-center" style={{borderColor: '#f59e0b', padding: '48px 64px', width: '1500px'}}>
                        <div className="text-yellow-400 font-bold" style={{fontSize: '36px'}}>
                            {totalMatches > 1 ? `GAME ${positionModalFor + 1} OF ${totalMatches}` : 'PLAYOFF MATCH'}
                        </div>
                        {totalMatches > 1 && (
                            <div className="text-white font-bold" style={{fontSize: '46px', marginTop: '10px'}}>
                                Now playing: <span style={{color: '#22d3ee'}}>{cfgForGame(positionModalFor)?.match?.name || '?'}</span>
                            </div>
                        )}
                        {totalMatches > 1 && positionModalFor === 0 && (
                            <div className="text-gray-300" style={{fontSize: '28px', marginTop: '8px'}}>
                                Order: {Array.from({ length: totalMatches }, (_, g) => `Game ${g + 1} = ${cfgForGame(g)?.match?.name || '?'}`).join('  \u00b7  ')}
                            </div>
                        )}
                        <img src={`${imagePath}${positionDecider.logo}`} alt={positionDecider.name}
                            style={{width: '260px', height: '260px', objectFit: 'contain', margin: '24px auto'}} />
                        <div className="text-white font-bold" style={{fontSize: '64px', lineHeight: 1.15}}>
                            Does {positionDecider.name} want to go first or second?
                        </div>
                        <div className="text-gray-400" style={{fontSize: '30px', marginTop: '12px'}}>
                            First = Team 1 (left) &nbsp;·&nbsp; Second = Team 2 (right)
                        </div>
                        <div className="flex justify-center gap-10" style={{marginTop: '40px'}}>
                            <button onClick={() => handlePositionChoice('first')}
                                className="bg-cyan-500 hover:bg-cyan-600 text-white font-bold rounded-xl border-4 border-black"
                                style={{fontSize: '56px', padding: '28px 90px'}}>FIRST</button>
                            <button onClick={() => handlePositionChoice('second')}
                                className="bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl border-4 border-black"
                                style={{fontSize: '56px', padding: '28px 90px'}}>SECOND</button>
                        </div>
                        <button onClick={() => setShowPositionModal(false)}
                            className="text-gray-400 hover:text-white underline" style={{fontSize: '26px', marginTop: '32px'}}>Cancel</button>
                    </div>
                </div>
            ) : null;

            // Seeding screen: mark each team Championship / Chump and give it a seed number
            const seedEditorJSX = showSeedEditor ? (() => {
                const listFor = (b) => teamsData
                    .filter(t => leagueSeeds[t.id] && leagueSeeds[t.id].bracket === b)
                    .sort((x, y) => ((leagueSeeds[x.id].seed || 99) - (leagueSeeds[y.id].seed || 99)) || x.name.localeCompare(y.name));
                const lists = { champ: listFor('champ'), chump: listFor('chump') };
                const pool = teamsData.filter(t => !(leagueSeeds[t.id] && leagueSeeds[t.id].bracket));
                // Rewrites one bracket from an ordered list so seeds are always 1, 2, 3... with no gaps
                const setOrder = (bracket, list) => {
                    const next = {};
                    Object.keys(leagueSeeds).forEach(k => { if (leagueSeeds[k].bracket !== bracket) next[k] = leagueSeeds[k]; });
                    list.forEach((t, i) => { next[t.id] = { bracket, seed: i + 1, ...(leagueSeeds[t.id] && leagueSeeds[t.id].elim ? { elim: leagueSeeds[t.id].elim } : {}) }; });
                    saveLeagueSeeds(next);
                };
                const place = (team, bracket) => { if (lists[bracket].length < 8) setOrder(bracket, [...lists[bracket], team]); };
                const removeFrom = (bracket, idx) => setOrder(bracket, lists[bracket].filter((_, i) => i !== idx));
                // Mark / un-mark a team as eliminated (the time is remembered so the bracket knows who lost to whom, in order)
                const toggleElim = (team) => {
                    const cur = leagueSeeds[team.id];
                    if (!cur || !cur.bracket) return;
                    const next = { ...leagueSeeds };
                    const entry = { ...cur };
                    if (entry.elim) delete entry.elim; else entry.elim = Date.now();
                    next[team.id] = entry;
                    saveLeagueSeeds(next);
                };
                const bySeedFor = (b) => {
                    const o = {};
                    lists[b].forEach((t, i) => { o[i + 1] = { id: t.id, name: t.name, logo: t.logo, color: t.color || '#7d3ad4', elim: (leagueSeeds[t.id] && leagueSeeds[t.id].elim) || 0, seed: i + 1 }; });
                    return o;
                };
                const move = (bracket, idx, d) => {
                    const arr = [...lists[bracket]]; const j = idx + d;
                    if (j < 0 || j >= arr.length) return;
                    [arr[idx], arr[j]] = [arr[j], arr[idx]];
                    setOrder(bracket, arr);
                };
                // ---- drag & drop / swap ----
                const applyLists = (champ, chump) => {
                    const next = {};
                    Object.keys(leagueSeeds).forEach(k => { const b = leagueSeeds[k].bracket; if (b !== 'champ' && b !== 'chump') next[k] = leagueSeeds[k]; });
                    champ.forEach((t, i) => { next[t.id] = { bracket: 'champ', seed: i + 1, ...(leagueSeeds[t.id] && leagueSeeds[t.id].elim ? { elim: leagueSeeds[t.id].elim } : {}) }; });
                    chump.forEach((t, i) => { next[t.id] = { bracket: 'chump', seed: i + 1, ...(leagueSeeds[t.id] && leagueSeeds[t.id].elim ? { elim: leagueSeeds[t.id].elim } : {}) }; });
                    saveLeagueSeeds(next);
                };
                const startDrag = (team, from) => (e) => { window.__htlDrag = { team, from }; try { e.dataTransfer.setData('text/plain', team.name); e.dataTransfer.effectAllowed = 'move'; } catch (err) {} };
                const allowDrop = (e) => { e.preventDefault(); };
                const dropOn = (bracket, idx) => (e) => {
                    e.preventDefault();
                    const d = window.__htlDrag; window.__htlDrag = null;
                    if (!d) return;
                    const L = { champ: [...lists.champ], chump: [...lists.chump] };
                    const occupant = lists[bracket][idx] || null;
                    if (occupant && occupant.id === d.team.id) return;
                    if (d.from) {
                        const A = d.from.bracket, a = d.from.idx;
                        if (occupant) { L[A][a] = occupant; L[bracket][idx] = d.team; }          // swap two teams
                        else { L[A].splice(a, 1); if (L[bracket].length >= 8) return; L[bracket].push(d.team); }   // move to an open seed
                    } else {
                        if (occupant) L[bracket][idx] = d.team;                                   // replaces; the old team goes back to "not placed"
                        else { if (L[bracket].length >= 8) return; L[bracket].push(d.team); }
                    }
                    applyLists(L.champ, L.chump);
                };
                const dropOnPool = (e) => {
                    e.preventDefault();
                    const d = window.__htlDrag; window.__htlDrag = null;
                    if (!d || !d.from) return;
                    const L = { champ: [...lists.champ], chump: [...lists.chump] };
                    L[d.from.bracket].splice(d.from.idx, 1);
                    applyLists(L.champ, L.chump);

                                                !showQuestion ? (
                                                    <button onClick={handleRevealQuestion} disabled={closestToQuestions.length > 0 && (closestToBase + bonusQuestionIndex) >= closestToQuestions.length}
                                                        className={`font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl ${(closestToQuestions.length > 0 && (closestToBase + bonusQuestionIndex) >= closestToQuestions.length) ? 'bg-gray-600 text-gray-400 cursor-not-allowed' : 'bg-blue-500 hover:bg-blue-600 text-white'}`}>
                                                        {(closestToQuestions.length > 0 && (closestToBase + bonusQuestionIndex) >= closestToQuestions.length) ? 'OUT OF CLOSEST TO QUESTIONS' : 'REVEAL QUESTION'}
                                                    </button>
                                                ) : !showBonusAnswer && !timerRunning && team1Time === 30 && team2Time === 30 && !(team1GuessSubmitted && team2GuessSubmitted) ? (
                                                    <button onClick={handleStartTimer} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        START TIMER
                                                    </button>
                                                ) : !showBonusAnswer ? (
                                                    <button onClick={handleRevealBonusAnswer} disabled={!team1GuessSubmitted && !team2GuessSubmitted}
                                                        title={(!team1GuessSubmitted && !team2GuessSubmitted) ? 'Submit at least one team\'s answer first' : ''}
                                                        className={`font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl ${(!team1GuessSubmitted && !team2GuessSubmitted) ? 'bg-gray-600 text-gray-400 cursor-not-allowed' : 'bg-yellow-500 hover:bg-yellow-600 text-white'}`}>
                                                        {(!team1GuessSubmitted && !team2GuessSubmitted) ? 'SUBMIT AN ANSWER FIRST' : 'REVEAL ANSWER'}
                                                    </button>
                                                ) : bonusWinnerAwarded ? (
                                                    <button onClick={handleBonusNext} className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        NEXT
                                                    </button>
                                                ) : null
                                            ) : (currentRound === 7 ? bonusType : tieBreakerType) === 'bottomsUp' ? (
                                                // Bottoms Up Buttons
                                                bottomsUpPhase === 'question' ? (
                                                    <button onClick={handleBottomsUpReveal} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        REVEAL QUESTION
                                                    </button>
                                                ) : bottomsUpPhase === 'ready' ? (
                                                    <>
                                                        <button onClick={handleBottomsUpStartTimer} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                            START TIMER
                                                        </button>
                                                        <button disabled className="bg-gray-600 text-gray-400 font-bold py-4 px-8 rounded-lg border-4 border-black text-xl cursor-not-allowed">
                                                            NO GUESS
                                                        </button>
                                                    </>
                                                ) : bottomsUpPhase === 'input' ? (
                                                    <>
                                                        <button onClick={handleResetTimer} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                            RESET TIMER
                                                        </button>
                                                        <button onClick={handleBottomsUpNoGuess} className="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                            NO GUESS
                                                        </button>
                                                    </>
                                                ) : bottomsUpPhase === 'between' ? (
                                                    bottomsUpClinchWinnerNow ? (
                                                        <button onClick={handleBottomsUpNextTurn} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                            AWARD {bottomsUpClinchWinnerNow === 1 ? (selectedTeam1?.name || 'TEAM 1') : (selectedTeam2?.name || 'TEAM 2')} &amp; CONTINUE
                                                        </button>
                                                    ) : (
                                                        <button onClick={handleBottomsUpNextTurn} className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                            NEXT TURN
                                                        </button>
                                                    )
                                                ) : null
                                            ) : (
                                                // Shootout Buttons
                                                shootoutSecondBoardPending ? (
                                                    <button onClick={handleAdvanceToSecondShootout} className="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        START NEXT SHOOTOUT QUESTION
                                                    </button>
                                                ) : !showQuestion ? (
                                                    <button onClick={handleRevealQuestion} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        REVEAL QUESTION
                                                    </button>
                                                ) : !shootoutBoardRevealed ? (
                                                    <button onClick={handleRevealShootoutBoard} className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        REVEAL THE BOARD
                                                    </button>
                                                ) : shootoutComplete ? (
                                                    <button onClick={handleNext} className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        NEXT
                                                    </button>
                                                ) : (
                                                    <button onClick={handleShootoutIncorrect} className="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        INCORRECT
                                                    </button>
                                                )
                                            )
                                        ) : (
                                            // Regular Round Buttons
                                            !showCategory ? (
                                                <button onClick={handleRevealCategory} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                    REVEAL CATEGORY
                                                </button>
                                            ) : powerupPhase ? (
                                                <button onClick={() => { setPowerupPhase(false); setPowerupTimer(30); }} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                    LOCK IN POWERUPS
                                                </button>
                                            ) : !showQuestion ? (
                                                <button 
                                                    onClick={handleRevealQuestion}
                                                    className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl"
                                                >
                                                    REVEAL QUESTION
                                                </button>
                                            ) : showQuestion && !showImageOverlay && (currentQuestion === 1 ? currentRoundData?.imageUrl1 : currentRoundData?.imageUrl2) ? (
                                                <button
                                                    onClick={handleRevealImage}
                                                    className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl"
                                                >
                                                    REVEAL IMAGE
                                                </button>
                                            ) : showAnswer ? (
                                                <button onClick={handleNext} className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                    NEXT
                                                </button>
                                            ) : !timerRunning && !showAnswer && ((activeTimer === 1 && team1Time > 0) || (activeTimer === 2 && team2Time > 0)) ? (
                                                <button onClick={handleStartTimer} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                    START TIMER
                                                </button>
                                            ) : (
                                                <>
                                                    <button onClick={handleCorrect} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        CORRECT
                                                    </button>
                                                    <button onClick={handleResetTimer} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        RESET TIMER
                                                    </button>
                                                    <button onClick={handleIncorrect} className="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-lg border-4 border-black transition text-xl">
                                                        INCORRECT
                                                    </button>
                                                </>
                                            )
                                        )}
                                    </div>
                                )}

                                <div className="flex flex-col gap-2 items-end" style={{position: 'absolute', right: 0, zIndex: showImageOverlay ? 50 : 50}}>
                                    <div className="flex gap-6">
                                        {/* Team 2 Double Dip */}
                                        {(team2Powerups.doubleDip || (doubleDipActive && doubleDipTeam === 2) || team2DoubleDipUsed) && (
                                            <img
                                                src={`${imagePath}powerup-dip.png`}
                                                alt="Team 2 Double Dip"
                                                className={
                                                    (doubleDipActive && doubleDipTeam === 2) || team2DoubleDipUsed ? 'powerup-activated' :
                                                    (team2DoublerActive || team2ExtraTimeActive || doubleDipSecondGuess) ? 'powerup-used' :
                                                    'powerup-available'
                                                }
                                                style={{width: '84px', height: '84px'}}
                                                onClick={userMode === 'host' ? () => handlePowerup(2, 'doubleDip') : undefined}
                                            />
                                        )}
                                        {/* Team 2 Extra Time */}
                                        {(team2Powerups.extraTime || team2ExtraTimeActive) && (
                                            <img
                                                src={`${imagePath}powerup-time.png`}
                                                alt="Team 2 Extra Time"
                                                className={
                                                    team2ExtraTimeActive ? 'powerup-activated' :
                                                    (team2DoublerActive || (doubleDipActive && doubleDipTeam === 2) || (!powerupPhase && showQuestion)) ? 'powerup-used' :
                                                    'powerup-available'
                                                }
                                                style={{width: '84px', height: '84px'}}
                                                onClick={userMode === 'host' ? () => handlePowerup(2, 'extraTime') : undefined}
                                            />
                                        )}
                                        {/* Team 2 Point Doubler */}
                                        {(team2Powerups.pointDoubler || team2DoublerActive) && (
                                            <img
                                                src={`${imagePath}powerup-double.png`}
                                                alt="Team 2 Point Doubler"
                                                className={
                                                    team2DoublerActive ? 'powerup-activated' :
                                                    (team2ExtraTimeActive || (doubleDipActive && doubleDipTeam === 2) || (!powerupPhase && showQuestion)) ? 'powerup-used' :
                                                    'powerup-available'
                                                }
                                                style={{width: '84px', height: '84px'}}
                                                onClick={userMode === 'host' ? () => handlePowerup(2, 'pointDoubler') : undefined}
                                            />
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Round Progress */}
                        <div className={`flex justify-center gap-2 ${showWinnerScreen ? 'hide-on-winner' : ''}`}>
                            {[1, 2, 3, 4, 5, 6].map((round) => (
                                <div
                                    key={round}
                                    className={`w-12 h-12 rounded-full flex items-center justify-center border-4 border-black font-bold text-lg ${
                                        round === currentRound ? 'bg-yellow-400 text-black' : round < currentRound ? 'bg-green-500 text-white' : 'bg-gray-600 text-white'
                                    }`}
                                >
                                    {round}
                                </div>
                            ))}
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center border-4 border-black font-bold text-sm ${
                                currentRound === 7 || currentRound === 14 ? 'bg-yellow-400 text-black' : currentRound > 7 ? 'bg-green-500 text-white' : 'bg-purple-500 text-white'
                            }`}>
                                {currentRound === 14 ? 'TB' : 'B'}
                            </div>
                            {[8, 9, 10, 11, 12, 13].map((round) => (
                                <div
                                    key={round}
                                    className={`w-12 h-12 rounded-full flex items-center justify-center border-4 border-black font-bold text-lg ${
                                        round === currentRound ? 'bg-yellow-400 text-black' : round < currentRound ? 'bg-green-500 text-white' : 'bg-gray-600 text-white'
                                    }`}
                                >
                                    {round - 1}
                                </div>
                            ))}
                        </div>

                        {/* Soundbar - Host only, hidden once winner reveal begins */}
                        {/* Visually hidden per request - not in use right now. Left fully in place (just
                            display:'none') rather than deleted, so all of its functionality (audio
                            playback, track/volume sync, etc.) still works underneath and this can be
                            switched back on later just by removing the display:'none' below. */}
                        {userMode === 'host' && !showWinnerScreen && (
                            <div style={{
                                display: 'none',
                                alignItems: 'center',
                                justifyContent: 'center',
                                gap: '12px',
                                marginTop: '16px',
                                background: 'rgba(0,0,0,0.6)',
                                borderRadius: '50px',
                                padding: '10px 24px',
                                border: '2px solid rgba(255,255,255,0.15)',
                                width: 'fit-content',
                                marginLeft: 'auto',
                                marginRight: 'auto',
                            }}>
                                {/* Volume slider */}
                                <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
                                    {showVolumeTooltip && (
                                        <div style={{
                                            position: 'absolute',
                                            bottom: '28px',
                                            left: '50%',
                                            transform: 'translateX(-50%)',
                                            background: 'rgba(0,0,0,0.85)',
                                            border: '1px solid rgba(255,255,255,0.2)',
                                            borderRadius: '6px',
                                            padding: '3px 8px',
                                            fontSize: '12px',
                                            fontWeight: 'bold',
                                            color: '#4ade80',
                                            whiteSpace: 'nowrap',
                                            pointerEvents: 'none',
                                        }}>
                                            {Math.round(soundbarVolume * 100)}%
                                        </div>
                                    )}
                                    <input
                                        type="range"
                                        className="soundbar-volume-slider"
                                        min="0"
                                        max="100"
                                        value={Math.round(soundbarVolume * 100)}
                                        onChange={(e) => {
                                            const newVolume = Number(e.target.value) / 100;
                                            setSoundbarVolume(newVolume);
                                            if (roomCode) {
                                                database.ref(`rooms/${roomCode}/gameState`).update({
                                                    soundbarVolume: newVolume,
                                                });
                                            }
                                        }}
                                        onMouseDown={() => setShowVolumeTooltip(true)}
                                        onMouseUp={() => setShowVolumeTooltip(false)}
                                        onTouchStart={() => setShowVolumeTooltip(true)}
                                        onTouchEnd={() => setShowVolumeTooltip(false)}
                                        title="Soundbar volume"
                                    />
                                </div>

                                {/* Divider */}
                                <div style={{width: '1px', height: '30px', background: 'rgba(255,255,255,0.2)'}} />

                                {/* Track buttons */}
                                {[
                                    { label: '🌑', name: 'Lights Down.mp3', title: 'Lights Down' },
                                    { label: '1-6', name: 'Questions 1-6.mp3', title: 'Questions 1-6' },
                                    { label: 'B', name: 'Bonus Round.mp3', title: 'Bonus Round' },
                                    { label: '7-12', name: 'Questions 7-12.mp3', title: 'Questions 7-12' },
                                    { label: 'TB', name: 'Tiebreaker.mp3', title: 'Tiebreaker' },
                                ].map(track => {
                                    const isActive = currentTrack === track.name && isPlaying;
                                    return (
                                        <button
                                            key={track.name}
                                            title={track.title}
                                            onClick={() => {
                                                if (currentTrack === track.name && isPlaying) return;
                                                setCurrentTrack(track.name);
                                                setIsPlaying(true);
                                                setTrackPosition(0);
                                                if (roomCode) {
                                                    database.ref(`rooms/${roomCode}/gameState`).update({
                                                        currentTrack: track.name,
                                                        isPlaying: true,
                                                        trackPosition: 0,
                                                    });
                                                }
                                            }}
                                            style={{
                                                width: '44px',
                                                height: '44px',
                                                borderRadius: '50%',
                                                border: isActive ? '3px solid #4ade80' : '2px solid rgba(255,255,255,0.3)',
                                                backgroundColor: isActive ? 'rgba(74,222,128,0.2)' : 'rgba(255,255,255,0.1)',
                                                color: isActive ? '#4ade80' : 'white',
                                                fontWeight: 'bold',
                                                fontSize: '11px',
                                                cursor: 'pointer',
                                                boxShadow: isActive ? '0 0 12px rgba(74,222,128,0.6)' : 'none',
                                                transition: 'all 0.2s',
                                            }}
                                        >
                                            {track.label}
                                        </button>
                                    );
                                })}

                                {/* Divider */}
                                <div style={{width: '1px', height: '30px', background: 'rgba(255,255,255,0.2)'}} />

                                {/* Play/Pause */}
                                <button
                                    title={isPlaying ? 'Pause' : 'Play'}
                                    onClick={() => {
                                        if (!currentTrack) return;
                                        const nextIsPlaying = !isPlaying;
                                        setIsPlaying(nextIsPlaying);
                                        if (roomCode) {
                                            database.ref(`rooms/${roomCode}/gameState`).update({
                                                isPlaying: nextIsPlaying,
                                            });
                                        }
                                    }}
                                    style={{
                                        width: '44px',
                                        height: '44px',
                                        borderRadius: '50%',
                                        border: '2px solid rgba(255,255,255,0.3)',
                                        backgroundColor: 'rgba(255,255,255,0.1)',
                                        color: 'white',
                                        fontSize: '18px',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                    }}
                                >
                                    {isPlaying ? '⏸' : '▶'}
                                </button>

                                {/* Stop */}
                                <button
                                    title="Stop"
                                    onClick={() => {
                                        setCurrentTrack(null);
                                        setIsPlaying(false);
                                        setTrackPosition(0);
                                        if (roomCode) {
                                            database.ref(`rooms/${roomCode}/gameState`).update({
                                                currentTrack: null,
                                                isPlaying: false,
                                                trackPosition: 0,
                                            });
                                        }
                                    }}
                                    style={{
                                        width: '44px',
                                        height: '44px',
                                        borderRadius: '50%',
                                        border: '2px solid rgba(255,255,255,0.3)',
                                        backgroundColor: 'rgba(255,255,255,0.1)',
                                        color: 'white',
                                        fontSize: '18px',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                    }}
                                >
                                    ⏹
                                </button>
                            </div>
                        )}
                    </div>
                </div>
                {showImageOverlay && (
                    <div style={{
                        position: 'fixed',
                        inset: 0,
                        backgroundColor: 'rgba(0,0,0,0.88)',
                        zIndex: 44,
                        pointerEvents: 'none',
                        animation: 'imageFadeIn 0.5s ease-in forwards'
                    }} />
                )}
                </>
            );
        }

        // ScaledCanvas: renders TriviaGame on a fixed 3200x1800 "virtual screen",
        // then scales that whole virtual screen up or down (via CSS transform) to fit
        // whatever browser window it's actually displayed in - StreamYard, a laptop,
        // a phone, whatever. Because the canvas itself is always exactly 3200x1800,
        // every pixel value and percentage inside TriviaGame now means the same real
        // thing every time, on every machine, instead of shifting based on each
        // host's actual window size like it did before.
        function ScaledCanvas() {
            // 3200x1800 is the content's actual natural size, measured directly from
            // Sam's reference screenshot (2560x1440 monitor at 80% browser zoom =
            // 3200x1800 true un-zoomed size).
            const CANVAS_WIDTH = 3200;
            const CANVAS_HEIGHT = 1800;
            const [scale, setScale] = React.useState(1);

            React.useEffect(() => {
                const updateScale = () => {
                    const scaleX = window.innerWidth / CANVAS_WIDTH;
                    const scaleY = window.innerHeight / CANVAS_HEIGHT;
                    // Use the smaller of the two so the whole 3200x1800 canvas always
                    // fits on screen without cropping (may letterbox on odd aspect ratios).
                    setScale(Math.min(scaleX, scaleY));
                };
                updateScale();
                window.addEventListener('resize', updateScale);
                return () => window.removeEventListener('resize', updateScale);
            }, []);

            return (
                <div style={{
                    width: '100vw',
                    height: '100vh',
                    overflow: 'hidden',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    backgroundColor: 'black'
                }}>
                    <div
                        style={{
                            width: `${CANVAS_WIDTH}px`,
                            height: `${CANVAS_HEIGHT}px`,
                            flexShrink: 0,
                            transform: `scale(${scale})`,
                            transformOrigin: 'center center',
                            position: 'relative'
                        }}
                    >
                        <TriviaGame />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ScaledCanvas />, document.getElementById('root'));
    </script>
</body>
</html>
