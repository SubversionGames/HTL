                if (!roomCode) return;
                
                setRoomCheckLoading(true);
                
                try {
                    // Read the existing data for this room code from Firebase
                    const roomRef = database.ref(`rooms/${roomCode}`);
                    const snapshot = await roomRef.once('value');
                    const roomData = snapshot.val();

                    console.log('Room data from Firebase:', roomData);
                    console.log('Has gameState:', roomData?.gameState ? 'YES' : 'NO');
                    
                    if (!roomData || !roomData.gameState) {
                        // No existing session - connect normally
                        setRoomCheckLoading(false);
                        setShouldConnect(true);
                        return;
                    }
                    
                    // Existing session found - store the data and show the modal
                    const gameState = roomData.gameState;
                    const lastActive = roomData.lastActive || 0;
                    const now = Date.now();
                    const minutesSinceActive = (now - lastActive) / 1000 / 60;
                    const isActive = minutesSinceActive < 5;
                    
                    setRoomCheckData({
                        gameState,
                        series: roomData.series || null,
                        isActive,
                        minutesSinceActive: Math.round(minutesSinceActive)
                    });
                    
                    setRoomCheckLoading(false);
                    setShowRoomCheckModal(true);
                    
                } catch (error) {
                    console.error('Error checking room code:', error);
                    setRoomCheckLoading(false);
                    // If there's an error checking, just connect normally
                    setShouldConnect(true);
                }
            };

            const handleRevealCategory = () => {
                // Only reset Extra Time tracking at the start of a new round (Q1)
                if (currentQuestion === 1) {
                    setTeam1ExtraTimeUsed(false);
                    setTeam2ExtraTimeUsed(false);
                }
                setShowCategory(true);
                setShowCategory(true);
                setTimerRunning(false); // Stop timer when revealing category
                // Reset timers to default at start of each question
                if (currentQuestion === 1) {
                    setTeam1Time(30);
                    setTeam2Time(15);
                } else {
                    setTeam1Time(15);
                    setTeam2Time(30);
                }
                // Check if all Point Doublers and Extra Times are used
                const allPowerupsUsed = !team1Powerups.pointDoubler && !team1Powerups.extraTime && 
                                        !team2Powerups.pointDoubler && !team2Powerups.extraTime;
                
                if (currentQuestion === 1 && !allPowerupsUsed) {
                    setPowerupPhase(true);
                    setPowerupTimer(30);
                }
            };

            const handleRevealQuestion = () => {
                setPowerupPhase(false);
                if (currentRound !== 7) setTimerRunning(false);
                
                if (currentRound === 7 || currentRound === 14) {
                    const activeBonusType = currentRound === 7 ? bonusType : tieBreakerType;
                    if ((activeBonusType === 'bottomsUp' && !(currentRound === 14 ? tieBreakerBottomsUpQuestion : bottomsUpQuestion)) ||
                        (activeBonusType === 'shootout' && !(currentRound === 14 ? selectedTieBreakerShootoutQuestion : selectedShootoutQuestion))) {
                        setHostWarning('This round has no unused question yet. Add a new one to the tab, then press Refresh Questions.');
                        return;
                    }
                    if (activeBonusType === 'closestTo') {
                        if (closestToQuestions.length > 0 && (closestToBase + bonusQuestionIndex) >= closestToQuestions.length) {
                            setHostWarning('No unused Closest To questions left in this series. Add more to the Closest To tab, then press Refresh Questions.');
                            return;
                        }
                        setTeam1Time(30);
                        setTeam2Time(30);
                        const currentQ = closestToSeries[bonusQuestionIndex];
                        setClosestToConsumed(c => Math.max(c, closestToBase + bonusQuestionIndex + 1));
                        if (currentQ && selectedMatch) {
                            markQuestionUsed('CLOSEST TO', selectedMatch.name, currentQ.rowIndex);
                        }
                        setShowQuestion(true);
                    } else if (activeBonusType === 'shootout') {
                        setTeam1Time(20);
                        setTeam2Time(20);
                        setShootoutBoxExpanded(true);
                        setTimeout(() => setShowQuestion(true), 1000);
                    } else {
                        setShowQuestion(true);
                    }
                } else {
                    setShowQuestion(true);
                }
                
                console.log('Revealing Q' + currentQuestion + ', Team1Active:', team1DoublerActive, ', Team2Active:', team2DoublerActive);
                
                // Apply Point Doubler for the current question based on tracking states
                if (currentQuestion === 1 && team1DoublerActive) {
                    setCurrentPointValue(2);
                    console.log('Set point value to 2 for Team 1');
                } else if (currentQuestion === 2 && team2DoublerActive) {
                    setCurrentPointValue(2);
                    console.log('Set point value to 2 for Team 2');
                } else {
                    setCurrentPointValue(1);
                    console.log('Set point value to 1');
                }
            };

            const handleStartTimer = () => {
                setTimerRunning(true);
            };

            // Resets the active team's clock to the full time it started this question with
            // (30, 45 if Extra Time was used, 15 for a steal, 10 for a Double Dip second guess,
            // 30 for a Bottoms Up turn) and starts counting down again right away.
            const handleResetTimer = () => {
                const bottomsUpNow = (currentRound === 7 || currentRound === 14) && (currentRound === 7 ? bonusType : tieBreakerType) === 'bottomsUp';
                let full;
                if (bottomsUpNow) full = 30;
                else if (doubleDipActive && doubleDipSecondGuess) full = 10;
                else if (stealAttempted) full = 15;
                else full = (activeTimer === 1 ? team1ExtraTimeUsed : team2ExtraTimeUsed) ? 45 : 30;
                if (activeTimer === 1) setTeam1Time(full); else setTeam2Time(full);
                setTimerRunning(true);
            };

            const handleCorrect = () => {
                // Clear Double Dip state when question is resolved correctly
                setDoubleDipActive(false);
                setDoubleDipTeam(null);
                setDoubleDipSecondGuess(false);
                setShowAnswer(true);
                setTimerRunning(false);
                if (activeTeam === 1) {
                    setTeam1Score(team1Score + currentPointValue);
                } else {
                    setTeam2Score(team2Score + currentPointValue);
                }
            };

            const handleIncorrect = () => {
                // Double Dip - First Guess Incorrect
                if (doubleDipActive && !doubleDipSecondGuess) {
                    // Move to second guess phase
                    setDoubleDipSecondGuess(true);
                    // Reset active team's timer to 10 seconds
                    if (doubleDipTeam === 1) {
                        setTeam1Time(10);
                        setActiveTimer(1);
                    } else {
                        setTeam2Time(10);
                        setActiveTimer(2);
                    }
                    // Auto-start the timer
                    setTimerRunning(true);
                    broadcastGameState();
                    return; // Stop here - don't proceed to normal incorrect logic
                }
                
                // Double Dip - Second Guess Incorrect
                if (doubleDipActive && doubleDipSecondGuess) {
                    // Clear Double Dip state and proceed to normal steal
                    setDoubleDipActive(false);
                    setDoubleDipTeam(null);
                    setDoubleDipSecondGuess(false);
                    // Fall through to normal incorrect/steal logic below
                }
                if (!stealAttempted) {
                    setStealAttempted(true);
                    setActiveTeam(activeTeam === 1 ? 2 : 1);
                    setActiveTimer(activeTeam === 1 ? 2 : 1);
                    setTimerRunning(true);
                } else {
                    setShowAnswer(true);
                    setTimerRunning(false);
                }
            };

            const handleSteal = () => {
                setShowAnswer(true);
                setTimerRunning(false);
                if (activeTeam === 1) {
                    setTeam1Score(team1Score + currentPointValue);
                } else {
                    setTeam2Score(team2Score + currentPointValue);
                }
            };

            const handleNext = () => {
                // Always shrink Shootout box
                setShootoutBoxExpanded(false);
                // If coming from completed Shootout, clean up and advance round
                if (shootoutComplete) {
                    setShootoutComplete(false);
                    setShootoutBoardRevealed(false);
                    setShootoutRevealedAnswers([]);
                    setShootoutShuffledAnswers([]);
                    setShootoutTurnCount(0);
                    setShootoutActiveTeam(1);
                    setShootoutSuddenDeath(false);
                    setBonusScore1(0);
                    setBonusScore2(0);
                    setCurrentRound(currentRound + 1);
                    setCurrentQuestion(1);
                    setActiveTeam(1);
                    setActiveTimer(1);
                    setTeam1Time(30);
                    setTeam2Time(15);
                    setShowCategory(false);
                    setShowQuestion(false);
                    setShowAnswer(false);
                    if (currentRound === 14) {
                        setIsTieBreaker(false);
                        setTieBreakerType(null);
                    }
                    return;
                }
                // Only clear active Double Dip state when moving to next ROUND
                if (currentQuestion === 2) {
                    setDoubleDipActive(false);
                    setDoubleDipTeam(null);
                    setDoubleDipSecondGuess(false);
                }
                // Only clear DoubleDipUsed when moving to next ROUND (not Q1→Q2)
                if (currentQuestion === 2) {
                    setTeam1DoubleDipUsed(false);
                    setTeam2DoubleDipUsed(false);
                }
                // Reset image state for next question
                setShowImageOverlay(false);
                setCurrentImageUrl(null);
                setTimersExpanded(false);
                setImageLoadError(false);
                if (currentQuestion === 1) {
                    setCurrentQuestion(2);
                    setActiveTeam(2);
                    setActiveTimer(2);
                    setTeam1Time(15); // Reset Team 1 back to default steal time
                    // Check if Team 2 activated Extra Time during powerup phase
                    setTeam2Time(team2ExtraTimeUsed ? 45 : 30);
                    setShowCategory(true);
                    setShowQuestion(false);
                    setShowAnswer(false);
                    setStealAttempted(false);
                    setCurrentPointValue(1);
                    setTimerRunning(false);
                } else {
                    if (currentRound < 13) {
                        const nextRound = currentRound + 1;
                        setCurrentRound(nextRound);
                        setCurrentQuestion(1);
                        setActiveTeam(1);
                        setActiveTimer(1);
                        // Reset to default times for new round
                        if (nextRound === 7) {
                            // Entering bonus round - both timers start at 30
                            setTeam1Time(30);
                            setTeam2Time(30);
                        } else {
                            // Regular round
                            setTeam1Time(30);
                            setTeam2Time(15);
                        }
                        setShowCategory(false);
                        setShowQuestion(false);
                        setTimerRunning(false); // IMPORTANT: Stop any running timers
                    } else if (currentRound === 13) {
                        // Check for tie after Round 12 (which is round 13 in code after bonus)
                        if (team1Score === team2Score) {
                            // Tie-breaker needed!
                            setIsTieBreaker(true);
                            // Use tieBreakerType set in admin wizard - do not override
                            setCurrentRound(14); // Tie-breaker round
                            setCurrentQuestion(1);
                            setActiveTeam(1);
                            setActiveTimer(1);
                            setTeam1Time(30);
                            setTeam2Time(15);
                            setShowCategory(false);
                            setShowQuestion(false);
                            setShowAnswer(false);
                            setTimerRunning(false);
                            setStealAttempted(false);
                            setCurrentPointValue(1);
                        } else {
                            // Game Over - someone won!
                            setWinnerTeam(team1Score > team2Score ? selectedTeam1 : selectedTeam2);
                            setShowWinnerScreen(true);
                        }
                        } else if (currentRound === 14) {
                            // Tie-breaker just finished - declare winner
                            const winner = team1Score > team2Score ? selectedTeam1 : selectedTeam2;
                            setWinnerTeam(winner);
                            setShowWinnerScreen(true);
                            return; // Stop here - game is over
                        }
                    setShowAnswer(false);
                    setStealAttempted(false);
                    setCurrentPointValue(1);
                    setTeam1DoublerActive(false);
                    setTeam2DoublerActive(false);
                    setTeam1ExtraTimeActive(false);
                    setTeam2ExtraTimeActive(false);
                    setTimerRunning(false);
                    setPowerupPhase(false);
                    setPowerupTimer(30);
                }
            };

            const handlePowerup = (team, powerup) => {
                // Only allow Point Doubler and Extra Time during powerup phase
                if ((powerup === 'pointDoubler' || powerup === 'extraTime') && !powerupPhase) return;
                
                if (team === 1) {
                    if (powerup === 'pointDoubler') {
                        if (!team1Powerups.pointDoubler && !team1DoublerActive) return; // Already used
                        if (team1DoublerActive) {
                            // Deactivate - only allowed during powerup phase (already checked above)
                            setTeam1DoublerActive(false);
                            setTeam1Powerups({...team1Powerups, pointDoubler: true});
                        } else if (team1Powerups.pointDoubler && powerupPhase && !team1ExtraTimeActive) {
                            // Activate
                            setTeam1Powerups({...team1Powerups, pointDoubler: false});
                            setTeam1DoublerActive(true);
                            console.log('Team 1 Doubler Activated');
                        }
                    } else if (powerup === 'extraTime') {
                        if (!team1Powerups.extraTime && !team1ExtraTimeActive) return; // Already used
                        if (team1ExtraTimeActive) {
                            // Deactivate - reset timer to 30
                            setTeam1ExtraTimeActive(false);
                            setTeam1Powerups({...team1Powerups, extraTime: true});
                            setTeam1ExtraTimeUsed(false);
                            setTeam1Time(30);
                        } else if (team1Powerups.extraTime && powerupPhase && !team1DoublerActive) {
                            // Activate
                            setTeam1Powerups({...team1Powerups, extraTime: false});
                            setTeam1ExtraTimeActive(true);
                            setTeam1ExtraTimeUsed(true);
                            setTeam1Time(45);
                        }
                    } else if (powerup === 'doubleDip') {
                        if (!team1Powerups.doubleDip && !doubleDipActive) return; // Already used
                        if (doubleDipActive && doubleDipTeam === 1 && !doubleDipSecondGuess) {
                            // Deactivate Double Dip (before first answer)
                            setDoubleDipActive(false);
                            setDoubleDipTeam(null);
                            setTeam1Powerups({...team1Powerups, doubleDip: true});
                        } else if (team1Powerups.doubleDip && activeTeam === 1 && showQuestion && !stealAttempted && !doubleDipSecondGuess) {
                            if (team1DoublerActive || team1ExtraTimeActive) return;
                            if (doubleDipActive) return;
                            setTeam1Powerups({...team1Powerups, doubleDip: false});
                            setDoubleDipActive(true);
                            setDoubleDipTeam(1);
                            setTeam1DoubleDipUsed(true);
                        }
                    }
                } else if (team === 2) {
                    if (powerup === 'pointDoubler') {
                        if (!team2Powerups.pointDoubler && !team2DoublerActive) return; // Already used
                        if (team2DoublerActive) {
                            setTeam2DoublerActive(false);
                            setTeam2Powerups({...team2Powerups, pointDoubler: true});
                        } else if (team2Powerups.pointDoubler && powerupPhase && !team2ExtraTimeActive) {
                            setTeam2Powerups({...team2Powerups, pointDoubler: false});
                            setTeam2DoublerActive(true);
                            console.log('Team 2 Doubler Activated');
                        }
                    } else if (powerup === 'extraTime') {
                        if (!team2Powerups.extraTime && !team2ExtraTimeActive) return; // Already used
                        if (team2ExtraTimeActive) {
                            setTeam2ExtraTimeActive(false);
                            setTeam2Powerups({...team2Powerups, extraTime: true});
                            setTeam2ExtraTimeUsed(false);
                            setTeam2Time(15);
                        } else if (team2Powerups.extraTime && powerupPhase && !team2DoublerActive) {
                            setTeam2Powerups({...team2Powerups, extraTime: false});
                            setTeam2ExtraTimeActive(true);
                            setTeam2ExtraTimeUsed(true);
                        }
                    } else if (powerup === 'doubleDip') {
                        if (!team2Powerups.doubleDip && !doubleDipActive) return; // Already used
                        if (doubleDipActive && doubleDipTeam === 2 && !doubleDipSecondGuess) {
                            setDoubleDipActive(false);
                            setDoubleDipTeam(null);
                            setTeam2Powerups({...team2Powerups, doubleDip: true});
                        } else if (team2Powerups.doubleDip && activeTeam === 2 && showQuestion && !stealAttempted && !doubleDipSecondGuess) {
                            if (team2DoublerActive || team2ExtraTimeActive) return;
                            if (doubleDipActive) return;
                            setTeam2Powerups({...team2Powerups, doubleDip: false});
                            setDoubleDipActive(true);
                            setDoubleDipTeam(2);
                            setTeam2DoubleDipUsed(true);
                        }
                    }
                }
            };

            // PLAYOFFS: who does this team play next in its bracket? Round 1 is fixed by seed (1v8, 4v5, 2v7, 3v6);
            // later rounds use whoever has advanced (from the ELIM marks). Returns a team from teamsData, or null if not known yet.
            const bracketOpponentFor = (team) => {
                const e = leagueSeeds[team.id];
                if (!e || !e.bracket || !(e.seed >= 1 && e.seed <= 8)) return null;
                const bySeed = {};
                teamsData.forEach(t => {
                    const x = leagueSeeds[t.id];
                    if (x && x.bracket === e.bracket && x.seed >= 1 && x.seed <= 8) bySeed[x.seed] = { id: t.id, elim: x.elim || 0 };
                });
                const res = resolveBracket(bySeed);
                for (let r = 0; r < 3; r++) {
                    const idx = res.cols[r].findIndex(c => c && String(c.id) === String(team.id));
                    if (idx < 0) continue;
                    const opp = res.cols[r][idx ^ 1];
                    if (!opp) return null;
                    if (!res.cols[r + 1][idx >> 1]) return teamsData.find(t => String(t.id) === String(opp.id)) || null;  // this match isn't decided yet
                }
                return null;
            };

            const handleTeamSelection = (team) => {
                if (!selectedTeam1) {
                    setSelectedTeam1(team);
                    // Playoffs: fill in the bracket opponent as Team 2 automatically (the host can still press Change on Team 2)
                    if (seasonType === 'playoff') {
                        const opp = bracketOpponentFor(team);
                        if (opp && opp.id !== team.id) setSelectedTeam2(opp);
                    }
                } else if (!selectedTeam2 && team.id !== selectedTeam1.id) {
                    setSelectedTeam2(team);
                }
            };
            
            const handleDeselectTeam = (teamNumber) => {
                if (teamNumber === 1) {
                    setSelectedTeam1(null);
                } else {
                    setSelectedTeam2(null);
                }
            };
            
            const handleConfirmTeams = () => {
                if (selectedTeam1 && selectedTeam2) {
                    if (seasonType === 'playoff' && !getSeedPair(selectedTeam1, selectedTeam2)) return;
                    // A series has already been played from this page: start the wizard from a clean slate
                    if (seriesStartedRef.current) { seriesStartedRef.current = false; setSeriesMatches([]); setLockedSlots([]); setSeriesOrder([]); }
                    setWizardMatchIdx(0);
                    setAdminStep(2);
                }
            };
            
            const handleConfirmSetup = () => {
                setBonusType(selectedBonusType);
                setTieBreakerType(selectedTiebreakerType);
                setTeamsConfirmed(true);
                setTimeout(() => broadcastGameState(), 100);
            };

            // ================== MULTI-MATCH SESSIONS + PLAYOFFS ==================

            // Looks up both teams' records on the league site (regular-season recap). Always editable afterwards.
            const loadRecordsFor = async (teams) => {
                setRecordsStatus('Looking up records on hometownstrivialeague.lol...');
                try {
                    const { season, rows } = await fetchLeagueStandings();
                    const next = {};
                    const missing = [];
                    teams.filter(Boolean).forEach(t => {
                        const r = rows.find(x => normTeamName(x.name) === normTeamName(t.name));
                        if (r) next[t.id] = `${r.w}-${r.l}`; else missing.push(t.name);
                    });
                    setTeamRecords(prev => ({ ...prev, ...next }));
                    setRecordsStatus(`Season ${season || '?'} standings loaded.` + (missing.length ? ` Couldn't find: ${missing.join(', ')} - type the record in.` : ''));
                } catch (e) {
                    setRecordsStatus("Couldn't reach the league site - type the records in (or leave blank).");
                }
            };

            // Move the first n items of a list to the end (used so each match in a session gets a
            // different block of 5 Closest To questions).
            const rotateList = (arr, n) => {
                if (!arr || arr.length === 0) return arr || [];
                const k = n % arr.length;
                return arr.slice(k).concat(arr.slice(0, k));
            };

            // Seeds: who is the higher seed (smaller number = higher) between two teams.
            // Returns null if either team has no seed yet or both have the same seed number.
            const getSeedPair = (teamA, teamB) => {
                if (!teamA || !teamB) return null;
                const a = leagueSeeds[teamA.id], b = leagueSeeds[teamB.id];
                if (!a || !b || !Number.isFinite(a.seed) || !Number.isFinite(b.seed) || a.seed === b.seed) return null;
                return a.seed < b.seed
                    ? { higher: teamA, lower: teamB, higherSeed: a, lowerSeed: b }
                    : { higher: teamB, lower: teamA, higherSeed: b, lowerSeed: a };
            };

            const SEEDS_FALLBACK_PATH = 'rooms/_leagueSeeds/seeds';
            const saveLeagueSeeds = (next) => {
                setLeagueSeeds(next);
                try { localStorage.setItem('htlLeagueSeeds', JSON.stringify(next)); } catch (e) {}
                // Some database setups only allow writing inside "rooms", so we also keep a copy there.
                const clean = JSON.parse(JSON.stringify(next));
                let okCount = 0, failCount = 0, lastErr = '';
                const done = (err) => {
                    if (err) { failCount++; lastErr = err.code || err.message || 'error'; } else okCount++;
                    if (okCount + failCount < 2) return;
                    setSeedsStatus(okCount > 0
                        ? 'Saved to the shared database.'
                        : 'Saved on this computer only - the database refused the write (' + lastErr + ').');
                };
                try { database.ref('leagueSeeds').set(clean, done); } catch (e) { done(e); }
                try { database.ref(SEEDS_FALLBACK_PATH).set(clean, done); } catch (e) { done(e); }
            };

            // Who decides First/Second for a given match number (0-based): matches 1 and 3 -> higher seed,
            // match 2 -> lower seed.
            const getPositionDecider = (matchNo) => {
                const pair = getSeedPair(selectedTeam1, selectedTeam2);
                if (!pair) return null;
                return matchNo % 2 === 0 ? pair.higher : pair.lower;
            };

            // Random pick that avoids questions already used (falls back to all if everything has been used).
            const pickFresh = (list, isUsed) => {
                const fresh = list.filter(q => !isUsed(q));
                const pool = fresh.length > 0 ? fresh : list;
                return pool[Math.floor(Math.random() * pool.length)];
            };
            const bottomsUpTextsUsedElsewhere = () => seriesMatches
                .filter((c, ci) => c && ci !== wizardMatchIdx && ci < totalMatches)
                .flatMap(c => [c.bottomsUpQuestion, c.tieBreakerBottomsUpQuestion])
                .filter(Boolean).map(q => q.questionText);

            // FAILSAFE: the same main match can never be saved into two slots of a series. Returns the other slot's index, or -1.
            const dupMatchSlot = () => (!selectedMatch ? -1 : seriesMatches.findIndex((c, ci) => ci !== wizardMatchIdx && ci < totalMatches && c && c.match && c.match.id === selectedMatch.id));

            // Wizard heads-up when this series COULD need more questions of a style than its tab holds ('' = fine). Warns only; any style can always be picked.
            const poolWarning = (type, role) => {
                if (!type) return '';
                const per = type === 'closestTo' ? 5 : 1;
                let need = 0;
                seriesMatches.forEach((c, ci) => { if (!c || ci === wizardMatchIdx || ci >= totalMatches) return; if (c.bonusType === type) need += per; if (c.tiebreakerType === type) need += 1; });
                if (selectedBonusType === type) need += per;
                if (role === 'tiebreaker' && selectedTiebreakerType === type) need += 1;
                const have = type === 'closestTo' ? closestToQuestions.length : type === 'bottomsUp' ? bottomsUpQuestions.length : shootoutQuestions.length;
                const name = type === 'closestTo' ? 'Closest To' : type === 'bottomsUp' ? 'Bottoms Up' : 'Shootout';
                if (need > have) return `Heads up: this series could need ${need} ${name} question${need > 1 ? 's' : ''} (tiebreakers only if they happen) but the ${name} tab has ${have}. If it runs out, the match stops until you add a new question to the ${name} tab and press Refresh Questions.`;
                return '';
            };

            // Put one match's saved setup (questions + bonus + tiebreaker) into the live game variables.
            const applyMatchCfg = (cfg) => {
                if (!cfg) return;
                setSelectedMatch(cfg.match || null);
                setSelectedBonusType(cfg.bonusType || null);
                setSelectedTiebreakerType(cfg.tiebreakerType || null);
                setBonusType(cfg.bonusType || null);
                setTieBreakerType(cfg.tiebreakerType || null);
                setBottomsUpQuestion(cfg.bottomsUpQuestion || null);
                setTieBreakerBottomsUpQuestion(cfg.tieBreakerBottomsUpQuestion || null);
                setSelectedShootoutQuestion(cfg.selectedShootoutQuestion || null);
                setSelectedTieBreakerShootoutQuestion(cfg.selectedTieBreakerShootoutQuestion || null);
            };

            // Same as above but only fills the wizard pickers (no live game variables), or clears them.
            const loadWizardCfg = (cfg) => {
                setSelectedMatch(cfg ? (cfg.match || null) : null);
                setSelectedBonusType(cfg ? (cfg.bonusType || null) : null);
                setSelectedTiebreakerType(cfg ? (cfg.tiebreakerType || null) : null);
                setBottomsUpQuestion(cfg ? (cfg.bottomsUpQuestion || null) : null);
                setTieBreakerBottomsUpQuestion(cfg ? (cfg.tieBreakerBottomsUpQuestion || null) : null);
                setSelectedShootoutQuestion(cfg ? (cfg.selectedShootoutQuestion || null) : null);
                setSelectedTieBreakerShootoutQuestion(cfg ? (cfg.selectedTieBreakerShootoutQuestion || null) : null);
            };

            // Put everything that belongs to ONE match back to its starting value (scores, rounds, powerups,
            // timers, bonus/shootout/Bottoms Up state...). Teams, wins and the sheets data are left alone.
            const resetMatchState = () => {
                setTeam1Score(0); setTeam2Score(0);
                setCurrentRound(1); setCurrentQuestion(1);
                setShowCategory(false); setShowQuestion(false); setShowAnswer(false);
                setActiveTeam(1); setActiveTimer(1); setStealAttempted(false);
                setTeam1Time(30); setTeam2Time(15); setTimerRunning(false);
                setTeam1Powerups({ extraTime: true, pointDoubler: true, doubleDip: true });
                setTeam2Powerups({ extraTime: true, pointDoubler: true, doubleDip: true });
                setCurrentPointValue(1);
                setPowerupPhase(false); setPowerupTimer(30);
                setTeam1DoublerActive(false); setTeam2DoublerActive(false);
                setTeam1ExtraTimeActive(false); setTeam2ExtraTimeActive(false);
                setTeam1ExtraTimeUsed(false); setTeam2ExtraTimeUsed(false);
                setTeam1DoubleDipUsed(false); setTeam2DoubleDipUsed(false);
                setDoubleDipActive(false); setDoubleDipTeam(null); setDoubleDipSecondGuess(false);
                setBonusScore1(0); setBonusScore2(0); setBonusQuestionIndex(0);
                setTeam1Guess(''); setTeam2Guess('');
                setTeam1GuessSubmitted(false); setTeam2GuessSubmitted(false);
                setShowBonusAnswer(false); setShowDistances(false); setBonusWinnerAwarded(false);
                setShootoutBoardRevealed(false); setShootoutBoxExpanded(false); setShootoutComplete(false);
                setShootoutRevealedAnswers([]); setShootoutShuffledAnswers([]);
                setShootoutTurnCount(0); setShootoutActiveTeam(1); setShootoutSuddenDeath(false);
                setShootoutSecondBoardPending(false);
                setBottomsUpTurnNumber(1); setBottomsUpActiveTeam(1); setBottomsUpUsedAnswers([]);
                setBottomsUpHostInput(''); setBottomsUpModalMatches([]); setBottomsUpShowModal(false);
                setBottomsUpConfirmedAnswer(null); setBottomsUpAnimating(false); setBottomsUpAnimationValue(0);
                setBottomsUpPhase('question'); setBottomsUpFlyingScore(false);
                setBottomsUpShowAnswer(false); setBottomsUpGlowing(false); setShowBottomsUpOverride(false);
                setIsTieBreaker(false);
                setShowWinnerScreen(false); setWinnerTeam(null);
                setShowImageOverlay(false); setCurrentImageUrl(null); setTimersExpanded(false); setImageLoadError(false);
                setCurrentTrack(null); setIsPlaying(false); setTrackPosition(0);
                setHostWarning('');
                setPlayoffNoticeDismissed(false);
            };

            // Which saved match setup is played as game number g (0-based)? Random order for playoff series, otherwise 1, 2, 3...
            const orderIdxFor = (g) => (seriesOrder.length === totalMatches && seriesOrder[g] !== undefined) ? seriesOrder[g] : g;
            const cfgForGame = (g) => seriesMatches[orderIdxFor(g)];
            const shuffledOrder = (n) => {
                const a = Array.from({ length: n }, (_, i) => i);
                for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
                return a;
            };

            // Wizard: save this match's whole setup (questions + bonus + tiebreaker), optionally lock it, then go to the next match or the recap.
            const saveWizardSlot = (lock) => {
                // ONE match: attach the tiebreaker question to the match now (never the bonus round's question)
                let tbBU = null, tbSO = null;
                if (totalMatches === 1 && !lockedSlots[wizardMatchIdx]) {
                    if (selectedTiebreakerType === 'bottomsUp') {
                        const pool = bottomsUpQuestions.filter(q => !(selectedBonusType === 'bottomsUp' && bottomsUpQuestion && q.questionText === bottomsUpQuestion.questionText));
                        if (pool.length > 0) tbBU = pool[Math.floor(Math.random() * pool.length)];
                    }
                    if (selectedTiebreakerType === 'shootout') {
                        const pool = shootoutQuestions.filter(q => !(selectedBonusType === 'shootout' && selectedShootoutQuestion && q.colIndex === selectedShootoutQuestion.colIndex));
                        if (pool.length > 0) tbSO = pool[Math.floor(Math.random() * pool.length)];
                    }
                } else if (totalMatches === 1) { tbBU = tieBreakerBottomsUpQuestion || null; tbSO = selectedTieBreakerShootoutQuestion || null; }
                if (dupMatchSlot() >= 0) { alert(`${selectedMatch.name} is already set for Match ${dupMatchSlot() + 1}. Go back and pick a different match.`); return; }
                const cfg = {
                    match: selectedMatch,
                    bonusType: selectedBonusType,
                    tiebreakerType: selectedTiebreakerType,
                    // Bottoms Up / Shootout questions are chosen when the round starts (from what the series hasn't used yet)
                    bottomsUpQuestion: (totalMatches === 1 && selectedBonusType === 'bottomsUp') ? (bottomsUpQuestion || null) : null,
                    tieBreakerBottomsUpQuestion: tbBU,
                    selectedShootoutQuestion: (totalMatches === 1 && selectedBonusType === 'shootout') ? (selectedShootoutQuestion || null) : null,
                    selectedTieBreakerShootoutQuestion: tbSO
                };
                setSeriesMatches(prev => { const a = prev.slice(0, totalMatches); a[wizardMatchIdx] = cfg; return a; });
                if (lock) setLockedSlots(prev => { const a = prev.slice(); a[wizardMatchIdx] = true; return a; });
                if (wizardMatchIdx < totalMatches - 1) {
                    loadWizardCfg(seriesMatches[wizardMatchIdx + 1] || null);
                    setWizardMatchIdx(wizardMatchIdx + 1);
                    setAdminStep(2);
                } else {
                    setAdminStep(5);
                }
            };

            // Start of the whole session (match 1). t1/t2 are the teams in Team 1 / Team 2 order.
            const beginSeries = (t1, t2) => {
                setSelectedTeam1(t1);
                setSelectedTeam2(t2);
                applyMatchCfg(cfgForGame(0));
                setSeriesMatchIndex(0);
                setSeriesWins({});
                setSeriesRecorded([]);
                setClosestToBase(0); setClosestToConsumed(0);   // new series: the shared Closest To list starts from the top
                seriesStartedRef.current = true;
                {   // questions already attached to a match (single-match series) count as used; multi-match series attach nothing up front
                    const cf = seriesMatches.slice(0, totalMatches).filter(Boolean);
                    setUsedShootoutColIndices(cf.flatMap(c => [c.selectedShootoutQuestion, c.selectedTieBreakerShootoutQuestion]).filter(Boolean).map(q => q.colIndex));
                    setUsedBottomsUpTexts(cf.flatMap(c => [c.bottomsUpQuestion, c.tieBreakerBottomsUpQuestion]).filter(Boolean).map(q => q.questionText));
                }
                setTeamsConfirmed(true);
                setShowPositionModal(false);
                setTimeout(() => broadcastGameState(), 100);
                handleStartMatch();
            };

            // Between matches: reset, load the next match's setup, then flash white, fly the logos in again
            // and show Round 1 (the same intro the first match gets, without the 10-to-1 countdown).
            const startNextMatch = (t1, t2) => {
                const nextIdx = seriesMatchIndex + 1;
                const cfg = cfgForGame(nextIdx);
                if (!cfg) return;
                setShowPositionModal(false);
                resetMatchState();
                setClosestToBase(closestToConsumed);   // continue down the shared Closest To list
                setSelectedTeam1(t1);
                setSelectedTeam2(t2);
                applyMatchCfg(cfg);
                setSeriesMatchIndex(nextIdx);
                // intro: same flags the normal match start uses
                skipIntroRef.current = false;
                setGameStarted(false);
                setIntroStep(0);
                setWhiteFading(true);
                setBackgroundFading(true);
                setShowIntro(true);
                // tell the Stream to run its own copy of the intro (it is not driven by broadcasts)
                try { database.ref(`rooms/${roomCode}/nextIntro`).set({ n: nextIdx, ts: Date.now() }); } catch (e) {}
                setTimeout(() => broadcastGameState(), 150);
                setTimeout(() => { if (!skipIntroRef.current) { setWhiteFading(false); setTimeout(() => broadcastGameState(), 100); } }, 1500);
                setTimeout(() => { if (!skipIntroRef.current) { setBackgroundFading(false); setTimeout(() => broadcastGameState(), 100); } }, introPlan(introHasBracketRef.current).bg);
                // pick up any spelling fixes made in the sheet since the match was set up
                setTimeout(() => { try { refreshLiveQuestionsRef.current && refreshLiveQuestionsRef.current(); } catch (e) {} }, 2500);
            };

            // Playoff: host confirms the early end of a match once one team can no longer catch up.
            const endMatchEarly = (winnerNumber) => {
                setTimerRunning(false);
                setWinnerTeam(winnerNumber === 1 ? selectedTeam1 : selectedTeam2);
                setShowWinnerScreen(true);
                setTimeout(() => broadcastGameState(), 100);
            };

            // The host answered the First/Second question (for playoffs).
            const handlePositionChoice = (choice) => {
                const pair = getSeedPair(selectedTeam1, selectedTeam2);
                if (!pair) { setShowPositionModal(false); return; }
                const decider = getPositionDecider(positionModalFor);
                const other = decider.id === pair.higher.id ? pair.lower : pair.higher;
                const first = choice === 'first' ? decider : other;
                const second = choice === 'first' ? other : decider;
                if (positionModalFor === 0) beginSeries(first, second);
                else startNextMatch(first, second);
            };

            const handleStartMatch = () => {
                if (window._countdownStarted) return;
                window._countdownStarted = true;
                setTimeout(() => { window._countdownStarted = false; }, 100);
                
                // Reset gameStarted so Stream doesn't jump to game screen
                setGameStarted(false);
                // Show countdown screen immediately
                setShowCountdown(true);
                setCountdownNumber(null);
                setCountdownFlipping(false);
                setTimeout(() => broadcastGameState(), 100);
                
                // Run the countdown sequence (visual only - no audio on Host)
                const runCountdown = (startNum) => {
                    for (let i = 0; i < startNum; i++) {
                        const num = startNum - i;
                        const timeMs = i * 1000;
                        
                        setTimeout(() => {
                            if (skipIntroRef.current) return;
                            setCountdownFlipping(false);
                            setCountdownNumber(num);
                            setTimeout(() => broadcastGameState(), 50);
                        }, timeMs);
                        
                        setTimeout(() => {
                            if (skipIntroRef.current) return;
                            setCountdownFlipping(true);
                        }, timeMs + 850);
                    }
                    
                    // After last number, start white flash
                    setTimeout(() => {
                        if (skipIntroRef.current) return;
                        setCountdownFading(true);
                        setTimeout(() => broadcastGameState(), 50);
                        setTimeout(() => {
                            if (skipIntroRef.current) return;
                            setWhiteFading(true);
                            setShowCountdown(false);
                            setCountdownFading(false);
                            setBackgroundFading(true);
                            setShowIntro(true);
                            setTimeout(() => broadcastGameState(), 50);
                            // White fades out after 1.5 seconds
                            setTimeout(() => {
                                if (skipIntroRef.current) return;
                                setWhiteFading(false);
                                setTimeout(() => broadcastGameState(), 200);
                            }, 1500);
                            // Background fully visible after 3.5 seconds
                            setTimeout(() => {
                                if (skipIntroRef.current) return;
                                setBackgroundFading(false);
                                setTimeout(() => broadcastGameState(), 50);
                            }, introPlan(introHasBracketRef.current).bg);
                        }, 2000);
                    }, startNum * 1000);
                };
                
                // Write timestamp NOW so Stream starts audio at same time as Host
                const startTime = Date.now();
                setMatchStartTimestamp(startTime);
                database.ref(`rooms/${roomCode}/matchStartTimestamp`).set(startTime);

                // Wait 2.5 seconds for audio lead-in, then start visual countdown from 10
                setTimeout(() => {
                    runCountdown(10);
                }, 2500);
            };

            // Broadcast game state to all streams
            const lastBroadcastRef = React.useRef(null);
            const broadcastGameState = () => { if (broadcastImplRef.current) broadcastImplRef.current(); };
            const broadcastGameStateImpl = () => {
                if (userMode === 'host' && roomCode) {
                    const gameState = {
                        selectedTeam1: selectedTeam1 ?? null,
                        selectedTeam2: selectedTeam2 ?? null,
                        selectedMatch: selectedMatch ?? null,
                        bonusType,
                        team1Score,
                        team2Score,
                        currentRound,
                        currentQuestion,
                        showCategory,
                        showQuestion,
                        showAnswer,
                        activeTeam,
                        team1Time,
                        team2Time,
                        timerRunning,
                        powerupPhase,
                        powerupTimer,
                        team1Powerups,
                        team2Powerups,
                        bonusScore1,
                        bonusScore2,
                        bonusQuestionIndex,
                        showBonusAnswer,
                        showDistances,
                        team1Guess,
                        team2Guess,
                        team1GuessSubmitted,
                        team2GuessSubmitted,
                        shootoutBoardRevealed,
                        shootoutBoxExpanded,
                        shootoutComplete,
                        shootoutRevealedAnswers,
                        shootoutShuffledAnswers,
                        shootoutTurnCount,
                        shootoutActiveTeam,
                        shootoutSuddenDeath,
                        // Broadcast selected questions so Stream shows same question as Host
                        selectedShootoutQuestion: selectedShootoutQuestion ?? null,
                        selectedTieBreakerShootoutQuestion: selectedTieBreakerShootoutQuestion ?? null,
                        usedShootoutColIndices,
                        usedBottomsUpTexts,
                        shootoutSecondBoardPending,
                        bottomsUpQuestion: bottomsUpQuestion ?? null,
                        bottomsUpTurnNumber,
                        bottomsUpActiveTeam,
                        bottomsUpUsedAnswers,
                        bottomsUpAnimating,
                        bottomsUpAnimationValue,
                        bottomsUpPhase,
                        bottomsUpFlyingScore,
                        bottomsUpShowAnswer,
                        bottomsUpGlowing,
                        bottomsUpConfirmedAnswer,
                        tieBreakerBottomsUpQuestion: tieBreakerBottomsUpQuestion ?? null,
                        closestToQuestions: closestToQuestions ?? [],
                        closestToBase, closestToConsumed,
                        isTieBreaker,
                        tieBreakerType,
                        teamsConfirmed,
                        gameStarted,
                        showIntro,
                        introStep,
                        showWinnerScreen,
                        winnerTeam: winnerTeam ?? null,
                        showImageOverlay,
                        currentImageUrl: currentImageUrl ?? null,
                        timersExpanded,
                        showCountdown,
                        countdownNumber,
                        countdownFlipping,
                        countdownFading,
                        backgroundFading,
                        whiteFading,
                        doubleDipSecondGuess,
                        doubleDipTeam,
                        doubleDipActive,
                        currentTrack,
                        isPlaying,
                        trackPosition,
                        soundbarVolume,
                        teamRecords, bracketInfo: hostBracketInfo, seriesInfo: { seasonType, totalMatches, matchIndex: seriesMatchIndex, order: seriesOrder, wins: seriesWins, recorded: seriesRecorded, noticeDismissed: playoffNoticeDismissed },
                    };
                    
                    // Lighter syncing: after the first full send, only the fields that CHANGED are sent
                    // (e.g. a timer tick sends 2 numbers instead of the entire game). A full send is
                    // repeated every 15 seconds so the Stream always self-heals if it missed anything.
                    const now = Date.now();
                    const gsRef = database.ref(`rooms/${roomCode}/gameState`);
                    const prev = lastBroadcastRef.current;
                    const nextJson = {};
                    Object.keys(gameState).forEach(k => { nextJson[k] = JSON.stringify(gameState[k]); });
                    if (!prev || prev.room !== roomCode || now - prev.fullAt > 15000) {
                        gsRef.set(gameState);
                        database.ref(`rooms/${roomCode}/lastActive`).set(now);
                        lastBroadcastRef.current = { room: roomCode, fullAt: now, json: nextJson };
                    } else {
                        const changed = {};
                        Object.keys(gameState).forEach(k => { if (nextJson[k] !== prev.json[k]) changed[k] = gameState[k]; });
                        if (Object.keys(changed).length > 0) gsRef.update(changed);
                        lastBroadcastRef.current = { room: roomCode, fullAt: prev.fullAt, json: nextJson };
                    }
                }
            };
            broadcastImplRef.current = broadcastGameStateImpl;
            
            const handleAdminLogin = () => {
                if (adminPassword === 'HaychTL3') {
                    setAdminAuthenticated(true);
                    setShowRoomSetup(true); // Show mode selection instead of admin modal
                } else {
                    alert('Incorrect password');
                    setAdminPassword('');
                }
            };
            
            const handleMatchSelection = (match) => {
                setSelectedMatch(match);
            };

            const handleSubmitGuess = (team) => {
                if (team === 1) {
                    setTeam1GuessSubmitted(true);
                } else {
                    setTeam2GuessSubmitted(true);
                }
            };
            
            const handleRevealBonusAnswer = () => {
                // Closest To catchall: never reveal when neither team has submitted an answer
                if (!team1GuessSubmitted && !team2GuessSubmitted) return;
                // Step 1: Show correct answer immediately
                setShowBonusAnswer(true);
                
                // Step 2: Show distances 2 seconds later
                setTimeout(() => {
                    setShowDistances(true);
                }, 2000);
                
                // Step 3: Calculate and award winner 2 seconds after distances appear
                setTimeout(() => {
                    const currentQuestion = closestToSeries[bonusQuestionIndex];
                    const correctAnswer = currentQuestion.answer;
                    const guess1 = parseCleanNumber(team1Guess) || 0;
                    const guess2 = parseCleanNumber(team2Guess) || 0;
                    
                    if (guess1 === guess2) {
                        // No points awarded
                    } else {
                        const diff1 = Math.abs(correctAnswer - guess1);
                        const diff2 = Math.abs(correctAnswer - guess2);
                        
                        if (guess1 === correctAnswer) {
                            setBonusScore1(bonusScore1 + 2);
                        } else if (guess2 === correctAnswer) {
                            setBonusScore2(bonusScore2 + 2);
                        } else {
                            if (diff1 < diff2) {
                                setBonusScore1(bonusScore1 + 1);
                            } else if (diff2 < diff1) {
                                setBonusScore2(bonusScore2 + 1);
                            }
                        }
                    }
                    
                    setBonusWinnerAwarded(true);
                }, 4000);
            };
            
            const handleBonusNext = () => {
                // Check if someone won (first to 3 points)
                if (bonusScore1 >= 3 || bonusScore2 >= 3) {
                    setClosestToBase(closestToConsumed);   // the next Closest To (bonus or tiebreaker) continues down the list
                    // Award points to match winner
                    if (currentRound === 14) {
                        // Tie-breaker is only worth 1 point
                        if (bonusScore1 >= 3) {
                            setTeam1Score(team1Score + 1);
                        } else {
                            setTeam2Score(team2Score + 1);
                        }
                    } else {
                        // Regular bonus is worth 2 points
                        if (bonusScore1 >= 3) {
                            setTeam1Score(team1Score + 2);
                        } else {
                            setTeam2Score(team2Score + 2);
                        }
                    }
                    
                    // Check if this was the tie-breaker
                    if (currentRound === 14) {
                        // Tie-breaker complete - declare winner
                        const finalScore1 = team1Score + (bonusScore1 >= 3 ? 1 : 0);
                        const finalScore2 = team2Score + (bonusScore2 >= 3 ? 1 : 0);
                        const winner = finalScore1 > finalScore2 ? selectedTeam1 : selectedTeam2;
                        
                        setTimeout(() => {
                            setWinnerTeam(winner);
                            setShowWinnerScreen(true);
                        }, 500);
                        // Reset bonus states but don't advance round
                        setBonusScore1(0);
                        setBonusScore2(0);
                        setBonusQuestionIndex(0);
                        setIsTieBreaker(false);
                        setTieBreakerType(null);
                        return; // Stop - game is over
                    }
                    
                    // Move to next round (regular bonus)
                    setCurrentRound(currentRound + 1);
                    setCurrentQuestion(1);
                    setActiveTeam(1);
                    setActiveTimer(1);
                    setTeam1Time(30);
                    setTeam2Time(15);
                    setShowCategory(false);
                    setShowQuestion(false);
                    
                    // Reset bonus states
                    setBonusScore1(0);
                    setBonusScore2(0);
                    setBonusQuestionIndex(0);
                } else {
                    // Move to next bonus question
                    setBonusQuestionIndex(bonusQuestionIndex + 1);
                }
                
                // Reset question states
                setShowAnswer(false);
                setShowBonusAnswer(false);
                setShowDistances(false);
                setBonusWinnerAwarded(false);
                setTeam1Guess('');
                setTeam2Guess('');
                setTeam1GuessSubmitted(false);
                setTeam2GuessSubmitted(false);
                setTimerRunning(false);
                setShowQuestion(false);
                // Reset timers for next bonus question
                setTeam1Time(30);
                setTeam2Time(30);
            };

            // Handles the host clicking "Reveal Image" during a question with an image
            const handleRevealImage = () => {
                // Figure out which question we're on (Q1 or Q2) and get its image URL
                const imageUrl = currentQuestion === 1 
                    ? currentRoundData?.imageUrl1 
                    : currentRoundData?.imageUrl2;
                
                // Convert the Google Drive sharing URL to a direct image URL
                const directUrl = convertDriveUrl(imageUrl);
                
                // Store the converted URL so the overlay knows what image to show
                setCurrentImageUrl(directUrl);
                
                // Reset any previous image load error
                setImageLoadError(false);
                
                // Slide the timer boxes outward immediately
                setTimersExpanded(true);
                
                // After 500ms, fade the image in
                setTimeout(() => {
                    setShowImageOverlay(true);
                }, 500);
            };

            const handleBottomsUpReveal = () => {
                setShowQuestion(true);
                setBottomsUpPhase('ready');
                // Mark this question as used in Google Sheets
                const activeQ = activeBottomsUpQuestion;
                if (activeQ && selectedMatch) {
                    markQuestionUsed('BOTTOMS UP', selectedMatch.name, null, activeQ.colIndex);
                }
            };

            const handleBottomsUpStartTimer = () => {
                if (bottomsUpActiveTeam === 1) {
                    setTeam1Time(30);
                    setActiveTimer(1);
                } else {
                    setTeam2Time(30);
                    setActiveTimer(2);
                }
                setActiveTeam(bottomsUpActiveTeam);
                setTimerRunning(true);
                setBottomsUpPhase('input');
                setBottomsUpHostInput('');
            };

            const handleBottomsUpSearch = () => {
                console.log('handleBottomsUpSearch called, input:', bottomsUpHostInput, 'question:', activeBottomsUpQuestion?.answers?.length, 'answers');
                if (!bottomsUpHostInput.trim()) return;
                if (!activeBottomsUpQuestion) {
                    // Used to fail silently (nothing happened when Enter was pressed). Now say so.
                    setHostWarning('The Bottoms Up question is not loaded - it is being reloaded now. Try again in a few seconds, or use BONUS OVERRIDE (bottom-left).');
                    return;
                }
                
                const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
                const typedNormalized = normalize(bottomsUpHostInput);

                const matches = activeBottomsUpQuestion.answers
                    .filter(answer => {
                        const answerNormalized = normalize(answer.text);
                        // Also check the second line (e.g. "(S22, 26, 34)" notes typed under the
                        // answer in the Google Sheet cell) so a host can find/select an answer by
                        // typing something that only appears in that second line, not just the name.
                        const secondLineNormalized = answer.secondLine ? normalize(answer.secondLine) : '';
                        return answerNormalized.includes(typedNormalized) ||
                            typedNormalized.includes(answerNormalized) ||
                            (secondLineNormalized && (secondLineNormalized.includes(typedNormalized) || typedNormalized.includes(secondLineNormalized)));
                    })
                    .map(answer => ({
                        ...answer,
                        isExact: normalize(answer.text) === typedNormalized,
                        alreadyUsed: bottomsUpUsedAnswers.includes(answer.pointValue)
                    }));
                
                setBottomsUpModalMatches(matches);
                setTimerRunning(false);
                setBottomsUpPhase('modal');
                setBottomsUpShowModal(true);
            };

            const handleBottomsUpConfirm = (answer) => {
                setBottomsUpConfirmedAnswer({...answer, text: answer.text.toUpperCase(), secondLine: answer.secondLine ? answer.secondLine.toUpperCase() : ''});
                setBottomsUpUsedAnswers(prev => [...prev, answer.pointValue]);
                setBottomsUpShowModal(false);
                setTimerRunning(false);
                setBottomsUpPhase('animating');
                runBottomsUpAnimation(answer.pointValue, true, bottomsUpActiveTeam);
            };

            const handleBottomsUpNotOnList = () => {
                setBottomsUpConfirmedAnswer({ text: bottomsUpHostInput.toUpperCase(), pointValue: 0 });
                setBottomsUpShowModal(false);
                setTimerRunning(false);
                setBottomsUpPhase('animating');
                runBottomsUpAnimation(0, false, bottomsUpActiveTeam);
            };

            const handleBottomsUpNoGuess = () => {
                setTimerRunning(false);
                setBottomsUpHostInput('');
                setBottomsUpConfirmedAnswer(null);
                
                // Early finish: if the other team can no longer even tie, the round is decided
                const noGuessClinchWinner = getBottomsUpClinchWinner({
                    score1: bonusScore1, score2: bonusScore2,
                    turnNumber: bottomsUpTurnNumber, teamJustWent: bottomsUpActiveTeam,
                    usedValues: bottomsUpUsedAnswers, answers: activeBottomsUpQuestion?.answers
                });
                if (noGuessClinchWinner) {
                    // Don't award anything yet: go to the 'between' phase so the "out of reach" notice
                    // shows on Host + Stream and the host confirms with a button.
                    setBottomsUpPhase('between');
                    return;
                }
                
                // Advance to next team/turn
                if (bottomsUpActiveTeam === 1) {
                    // Move to Team 2's turn (same turn number)
                    setBottomsUpActiveTeam(2);
                    setActiveTimer(2);
                } else {
                    // Team 2 just went - check if round is over
                    const nextTurn = bottomsUpTurnNumber + 1;
                    if (bottomsUpTurnNumber >= 5) {
                        // Check for tie
                        if (bonusScore1 !== bonusScore2) {
                            handleBottomsUpComplete();
                            return;
                        }
                        // Tied - continue to next turn
                    }
                    setBottomsUpTurnNumber(nextTurn);
                    setBottomsUpActiveTeam(1);
                    setActiveTimer(1);
                }
                
                setTeam1Time(30);
                setTeam2Time(30);
                setBottomsUpPhase('ready');
            };

            const handleBottomsUpNextTurn = () => {
                setBottomsUpConfirmedAnswer(null);
                setBottomsUpAnimating(false);
                setBottomsUpAnimationValue(0);
                setBottomsUpHostInput('');
                
                // Early finish: this is the host's confirmation of the "out of reach" notice
                const nextTurnClinchWinner = getBottomsUpClinchWinner({
                    score1: bonusScore1, score2: bonusScore2,
                    turnNumber: bottomsUpTurnNumber, teamJustWent: bottomsUpActiveTeam,
                    usedValues: bottomsUpUsedAnswers, answers: activeBottomsUpQuestion?.answers
                });
                if (nextTurnClinchWinner) {
                    finishBottomsUpRound(nextTurnClinchWinner);
                    return;
                }
                
                if (bottomsUpActiveTeam === 1) {
                    // Move to Team 2's turn (same turn number)
                    setBottomsUpActiveTeam(2);
                    setActiveTimer(2);
                    setTeam1Time(30);
                    setTeam2Time(30);
                    setBottomsUpPhase('ready');
                } else {
                    // Team 2 just finished - check if round is over
                    const nextTurn = bottomsUpTurnNumber + 1;
                    if (bottomsUpTurnNumber >= 5 && bonusScore1 !== bonusScore2) {
                        // All turns done and there's a winner
                        handleBottomsUpComplete();
                        return;
                    }
                    // Continue to next turn (or keep going if tied)
                    setBottomsUpTurnNumber(nextTurn);
                    setBottomsUpActiveTeam(1);
                    setActiveTimer(1);
                    setTeam1Time(30);
                    setTeam2Time(30);
                    setBottomsUpPhase('ready');
                }
            };

            // The normal end of a Bottoms Up round: whoever has more points wins.
            const handleBottomsUpComplete = () => {
                finishBottomsUpRound(bonusScore1 > bonusScore2 ? 1 : 2);
            };

            // Ends the Bottoms Up round and moves the match on. winner is 1 or 2 (that team gets the
            // match points), or 0 (host override "skip bonus" - nobody gets points; bonus rounds only).
            // Used by the normal end of the round, the automatic "can't catch up" early finish, and
            // the host override panel.
            const finishBottomsUpRound = (winner) => {
                setTimerRunning(false);
                setBottomsUpShowModal(false);
                setBottomsUpShowAnswer(false);
                setBottomsUpFlyingScore(false);
                setBottomsUpGlowing(false);
                setShowBottomsUpOverride(false);
                
                if (currentRound === 14) {
                    // Tiebreaker - worth 1 match point
                    if (winner === 1) {
                        setTeam1Score(team1Score + 1);
                    } else {
                        setTeam2Score(team2Score + 1);
                    }
                    // Check final scores to declare match winner
                    const finalScore1 = team1Score + (winner === 1 ? 1 : 0);
                    const finalScore2 = team2Score + (winner === 2 ? 1 : 0);
                    setTimeout(() => {
                        setWinnerTeam(finalScore1 > finalScore2 ? selectedTeam1 : selectedTeam2);
                        setShowWinnerScreen(true);
                    }, 500);
                    // Reset bonus states
                    setBonusScore1(0);
                    setBonusScore2(0);
                    setBottomsUpTurnNumber(1);
                    setBottomsUpActiveTeam(1);
                    setBottomsUpUsedAnswers([]);
                    setBottomsUpPhase('question');
                    setIsTieBreaker(false);
                    setTieBreakerType(null);
                    return;
                }
                
                // Regular bonus - worth 2 match points (winner 0 = host skipped it, no points)
                if (winner === 1) {
                    setTeam1Score(team1Score + 2);
                } else if (winner === 2) {
                    setTeam2Score(team2Score + 2);
                }
                
                // Move to next round
                setCurrentRound(currentRound + 1);
                setCurrentQuestion(1);
                setActiveTeam(1);
                setActiveTimer(1);
                setTeam1Time(30);
                setTeam2Time(15);
                setShowCategory(false);
                setShowQuestion(false);
                setTimerRunning(false);
                
                // Reset all Bottoms Up states
                setBonusScore1(0);
                setBonusScore2(0);
                setBottomsUpTurnNumber(1);
                setBottomsUpActiveTeam(1);
                setBottomsUpUsedAnswers([]);
                setBottomsUpPhase('question');
                setBottomsUpConfirmedAnswer(null);
                setBottomsUpAnimating(false);
                setBottomsUpAnimationValue(0);
                setBottomsUpHostInput('');
            };

            const runBottomsUpAnimation = (pointValue, isCorrect, activeTeamSnapshot) => {
                setBottomsUpAnimating(true);
                setBottomsUpShowAnswer(true);
                setBottomsUpFlyingScore(false);
                setBottomsUpAnimationValue(0);

                // All the delays below are half of what they used to be, so the whole score
                // reveal (count-up, glow, fly-to-score) plays out in about half the time.
                if (!isCorrect || pointValue === 0) {
                    setTimeout(() => {
                        setBottomsUpAnimationValue(-1);
                        setTimeout(() => {
                            setBottomsUpAnimating(false);
                            setBottomsUpShowAnswer(false);
                            setBottomsUpPhase('between');
                        }, 1000);
                    }, 400);
                    return;
                }

                let current = 0;
                const getDelay = (step, total) => {
                    const progress = step / total;
                    return Math.round(100 - (90 * progress));
                };

                const tick = (step) => {
                    if (step > pointValue) {
                        // Counter done - start glow phase
                        setBottomsUpGlowing(true);

                        // After 1 second of glowing, start the fly phase
                        setTimeout(() => {
                            setBottomsUpGlowing(false);
                            setBottomsUpShowAnswer(false);
                            setBottomsUpFlyingScore(true);

                            setTimeout(() => {
                                if (activeTeamSnapshot === 1) {
                                    setBonusScore1(prev => prev + pointValue);
                                } else {
                                    setBonusScore2(prev => prev + pointValue);
                                }
                                setBottomsUpFlyingScore(false);
                                setBottomsUpAnimating(false);
                                setBottomsUpPhase('between');
                            }, 800);
                        }, 1000);
                        return;
                    }
                    setBottomsUpAnimationValue(step);
                    setTimeout(() => tick(step + 1), getDelay(step, pointValue));
                };

                setTimeout(() => tick(1), 400);
            };
            
            const handleRevealShootoutBoard = () => {
                setShootoutBoardRevealed(true);
                setShootoutActiveTeam(1);
                setShootoutTurnCount(0);
                setTimerRunning(true); // Auto-start timer for Team 1
                
                // Mark this Shootout question as used
                const activeShootoutQ = currentRound === 14 ? tieBreakerShootoutQuestion : shootoutQuestion;
                if (activeShootoutQ && selectedMatch) {
                    markQuestionUsed('SHOOTOUT', selectedMatch.name, null, activeShootoutQ.colIndex);
                }
            };
            
            // Stage 1 of starting a second Shootout: called the instant the board is
            // about to run out of answers. Deliberately changes NOTHING else - the
            // finished board and final scores stay fully visible so the host can
            // speak to the moment before anything resets. handleAdvanceToSecondShootout
            // (Stage 2, triggered by a host button) does the actual reset.
            
            // Stage 2: host has clicked the button to actually move on. Picks a
            // genuinely unused question (never repeats one already seen this match),
            // resets scores to 0, turn count, active team, and Sudden Death, then
            // replays the exact same "REVEAL QUESTION" step the very first question
            // used (box expands, question text appears). From there it's identical
            // to normal - the host still clicks REVEAL THE BOARD separately when
            // ready, just like at the start of any Shootout.
            const handleAdvanceToSecondShootout = () => {
                const availableQuestions = shootoutQuestions.filter(q => !usedShootoutColIndices.includes(q.colIndex));
                if (availableQuestions.length === 0) {
                    // Never replay a board: stay here until a new question is added to the Shootout tab and the sheet is refreshed
                    setHostWarning('No unused Shootout question left in this series. Add a new one to the Shootout tab, press Refresh Questions, then click again.');
                    return;
                }
                const newQuestion = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
                setUsedShootoutColIndices(prev => [...prev, newQuestion.colIndex]);

                if (currentRound === 14) {
                    setSelectedTieBreakerShootoutQuestion(newQuestion);
                } else {
                    setSelectedShootoutQuestion(newQuestion);
                }

                // Full reset - entirely fresh shootout, no longer sudden death
                setBonusScore1(0);
                setBonusScore2(0);
                setShootoutTurnCount(0);
                setShootoutActiveTeam(1);
                setShootoutSuddenDeath(false);
                setShootoutRevealedAnswers([]);
                setShootoutBoardRevealed(false);
                setShowQuestion(false);
                setTimerRunning(false);
                setShootoutSecondBoardPending(false);

                // Same as handleRevealQuestion's Shootout branch: box expands, then
                // the question text appears shortly after. Host clicks REVEAL THE
                // BOARD separately from here on, same as the first question.
                setTeam1Time(20);
                setTeam2Time(20);
                setShootoutBoxExpanded(true);
                setTimeout(() => setShowQuestion(true), 1000);
            };

            const handleShootoutAnswer = (answerIndex) => {
                if (shootoutRevealedAnswers.includes(answerIndex)) return;
                
                // If game is complete, just reveal the answer - no scoring
                if (shootoutComplete) {
                    setShootoutRevealedAnswers([...shootoutRevealedAnswers, answerIndex]);
                    return;
                }
                
                // Reveal the answer
                setShootoutRevealedAnswers([...shootoutRevealedAnswers, answerIndex]);
                
                // Calculate new scores
                const newScore1 = shootoutActiveTeam === 1 ? bonusScore1 + 1 : bonusScore1;
                const newScore2 = shootoutActiveTeam === 2 ? bonusScore2 + 1 : bonusScore2;
                
                // Award point to active team
                if (shootoutActiveTeam === 1) {
                    setBonusScore1(newScore1);
                } else {
                    setBonusScore2(newScore2);
                }
                
                // Calculate new turn count
                const newTurnCount = shootoutActiveTeam === 2 ? shootoutTurnCount + 1 : shootoutTurnCount;
                
                if (shootoutActiveTeam === 2) {
                    setShootoutTurnCount(newTurnCount);
                }
                
                // Check if game should end - pass fresh scores to avoid stale closure
                if (newTurnCount >= 5 && shootoutSuddenDeath && shootoutActiveTeam === 2 && newScore1 !== newScore2) {
                    setTimeout(() => handleShootoutComplete(newScore1, newScore2), 100);
                    return;
                }
                
                let enteringSuddenDeath = false;
                if (newTurnCount >= 5 && !shootoutSuddenDeath) {
                    if (newScore1 !== newScore2) {
                        setTimeout(() => handleShootoutComplete(newScore1, newScore2), 100);
                        return;
                    } else {
                        setShootoutSuddenDeath(true);
                        enteringSuddenDeath = true;
                    }
                }
                
                // End early (before all 5 rounds are played) if the trailing team can no
                // longer catch up even if they get every one of their remaining turns
                // right and the leading team misses every one of theirs. Team 1 always
                // goes first each round, so by the time either team's turn is being
                // resolved here, Team 1 has always already taken their turn for the
                // current round - that's what makes "shootoutTurnCount + 1" always the
                // right value for Team 1's turns taken, in both branches below.
                if (!shootoutSuddenDeath && !enteringSuddenDeath) {
                    const team1TurnsTaken = shootoutTurnCount + 1;
                    const team2TurnsTaken = newTurnCount;
                    const team1TurnsRemaining = 5 - team1TurnsTaken;
                    const team2TurnsRemaining = 5 - team2TurnsTaken;
