<body>
    <div id="root"></div>
    <!-- Small, faint "last updated" stamp for the Host / Main screens (hidden on the Stream screen). The text between
         the markers is rewritten every time an update is published. -->
    <div id="htl-version" style="position:fixed;right:10px;bottom:6px;z-index:2147483000;pointer-events:none;font:600 11px/1.2 Poppins,Arial,sans-serif;color:#fff;opacity:0.3;text-shadow:0 0 3px #000;letter-spacing:0.02em">Version Update: <!--VERSION-->Nov 11, 2026 10:15 AM PT<!--/VERSION--></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Pulls a real number out of text that may contain formatting like commas,
        // currency symbols, or other punctuation - e.g. "1,093" or "$1,093.50".
        // Plain parseFloat/parseInt both stop reading at the first character that
        // isn't part of a number, so "1,093" silently becomes just 1. This strips
        // everything except digits, a single leading minus sign, and a decimal
        // point first, so the full value is preserved. Used for Closest To answers
        // and guesses specifically - Shootout and Bottoms Up compare answers as
        // plain text and were never affected by this.
        function parseCleanNumber(value) {
            if (value === null || value === undefined) return NaN;
            const cleaned = String(value).replace(/[^0-9.\-]/g, '');
            return parseFloat(cleaned);
        }

        // --- Bottoms Up answer auto-fit helpers ---
        // Measures how wide a piece of text would render at a given font size, using a hidden
        // <canvas> (this never gets shown on screen, it's just used to measure text).
        let _textMeasureCanvas = null;
        const measureTextWidthPx = (text, fontSizePx, fontWeight, fontFamily) => {
            if (!_textMeasureCanvas) {
                _textMeasureCanvas = document.createElement('canvas');
            }
            const ctx = _textMeasureCanvas.getContext('2d');
            ctx.font = `${fontWeight} ${fontSizePx}px ${fontFamily}`;
            return ctx.measureText(text).width;
        };
        // Returns baseFontSizePx if `text` already fits inside maxWidthPx at that size, otherwise
        // returns a smaller font size that makes it fit exactly.
        const getFittedFontSize = (text, maxWidthPx, baseFontSizePx, fontWeight = '900', fontFamily = 'Arial, sans-serif') => {
            if (!text) return baseFontSizePx;
            const widthAtBase = measureTextWidthPx(text, baseFontSizePx, fontWeight, fontFamily);
            if (widthAtBase <= maxWidthPx) return baseFontSizePx;
            return Math.floor(baseFontSizePx * (maxWidthPx / widthAtBase));
        };

        // Finds the largest font size (between minFontSizePx and maxFontSizePx) at which `text` -
        // allowed to wrap onto multiple lines, same as it would in a normal paragraph - still ends up
        // fitting inside a maxWidthPx x maxHeightPx box. Works by simulating the same greedy word-wrap
        // a browser does (fit as many words per line as will fit), at each font size from the largest
        // down, and checking whether the resulting number of lines still fits the height. Used for the
        // Bottoms Up question text, which can be long enough in the Google Sheet to need shrinking to
        // fit its box.
        const fitMultilineFontSize = (text, maxWidthPx, maxHeightPx, maxFontSizePx, minFontSizePx, fontWeight = '400', fontFamily = 'Arial, sans-serif', lineHeightMultiplier = 1.6) => {
            if (!text) return maxFontSizePx;
            const words = text.split(/\s+/).filter(w => w !== '');
            if (words.length === 0) return maxFontSizePx;
            for (let fontSize = maxFontSizePx; fontSize >= minFontSizePx; fontSize -= 2) {
                const spaceWidth = measureTextWidthPx(' ', fontSize, fontWeight, fontFamily);
                let lines = 1;
                let lineWidth = 0;
                words.forEach(word => {
                    const wordWidth = measureTextWidthPx(word, fontSize, fontWeight, fontFamily);
                    if (lineWidth === 0) {
                        lineWidth = wordWidth;
                    } else if (lineWidth + spaceWidth + wordWidth <= maxWidthPx) {
                        lineWidth += spaceWidth + wordWidth;
                    } else {
                        lines += 1;
                        lineWidth = wordWidth;
                    }
                });
                const totalHeight = lines * fontSize * lineHeightMultiplier;
                if (totalHeight <= maxHeightPx) {
                    return fontSize;
                }
            }
            return minFontSizePx;
        };

        // ───────────────────────────────────────────────────────────────────────────────
        // Google Sheets parsers. These used to live inline inside fetchSheetsData; they were
        // moved here, unchanged, so that the first load of the sheet AND the live "refresh
        // questions" feature read the sheet in exactly the same way (one copy of the rules,
        // so the two can never drift apart). Each takes the raw rows Google returns and gives
        // back the same objects the game has always used.
        // ───────────────────────────────────────────────────────────────────────────────

        // MATCH tab rows (A2:F25) -> array of rounds
        const parseMatchRows = (rows) => {
            const rounds = [];
            for (let i = 0; i < rows.length; i += 2) {
                const row1 = rows[i] || [];
                const row2 = rows[i + 1] || [];

                if (row1.length < 5) continue; // Skip incomplete rows

                rounds.push({
                    category: row1[1] || '',      // Column B
                    question1: row1[3] || '',     // Column D
                    answer1: row1[4] || '',       // Column E
                    imageUrl1: row1[5] || null,   // Column F (optional image for Q1)
                    question2: row2[3] || '',     // Column D
                    answer2: row2[4] || '',       // Column E
                    imageUrl2: row2[5] || null    // Column F (optional image for Q2)
                });
            }
            return rounds;
        };

        // CLOSEST TO tab rows (A2:C1000) -> array of questions (in sheet order, NOT shuffled -
        // the caller shuffles on first load only, so a live refresh never re-orders the match)
        const parseClosestToRows = (ctRows) => {
            return ctRows
                .filter(row => row[0] && row[1]) // Must have question and answer
                .map((row, index) => ({
                    question: row[0],
                    answer: parseCleanNumber(row[1]),
                    lastUsed: row[2] || '',
                    rowIndex: index + 2 // +2 because row 1 is the header, data starts at row 2
                }));
        };

        // SHOOTOUT tab rows (A1:Z200) -> array of questions (one per column)
        const parseShootoutRows = (soRows) => {
            const questions = [];
            if (soRows.length === 0) return questions;

            // Calculate max columns across ALL rows so we don't miss columns where Row 1 is empty
            const numCols = Math.max(...soRows.map(row => row?.length || 0));

            for (let col = 1; col < numCols; col++) {
                const longQuestion = soRows[0]?.[col] || '';   // Row 1, this column
                const lastUsed = soRows[1]?.[col] || '';       // Row 2, this column
                const shortQuestion = soRows[2]?.[col] || '';  // Row 3, this column

                // Answers start at Row 4 (index 3)
                const answers = [];
                for (let row = 3; row < soRows.length; row++) {
                    const answer = soRows[row]?.[col];
                    if (answer && answer.trim() !== '') {
                        answers.push(answer.trim());
                    }
                }

                if (longQuestion && answers.length > 0) {
                    questions.push({
                        colIndex: col,
                        longQuestion,
                        shortQuestion,
                        lastUsed,
                        answers
                    });
                }
            }
            return questions;
        };

        // BOTTOMS UP tab rows (A1:Z200) -> array of questions (one per column)
        // Row 1 (index 0) = question text
        // Row 2 (index 1) = Last Used (blank)
        // Row 3+ (index 2+) = answer choices, where Row 3 = 1 point, Row 4 = 2 points, etc.
        // A cell can hold MULTIPLE tied answers separated by semicolons
        // (e.g. "Player A; Player B; Player C") when several entries share
        // the same real-world rank. All names in that cell get the same
        // point value, and every row after it skips ahead by however many
        // names tied for that spot - e.g. 5 players tied for 10th place
        // (worth 10 points each) means the next row is worth 15, not 11.
        const parseBottomsUpRows = (buRows) => {
            const buQuestions = [];
            if (buRows.length === 0) return buQuestions;
            const numCols = Math.max(...buRows.map(row => row?.length || 0));

            for (let col = 1; col < numCols; col++) {
                const questionText = buRows[0]?.[col] || '';
                const lastUsed = buRows[1]?.[col] || '';

                // Answers start at row index 2 (Row 3 in Sheet)
                const answers = [];
                let rankCounter = 0; // how many rank slots have been used up so far
                for (let row = 2; row < buRows.length; row++) {
                    const cellValue = buRows[row]?.[col];
                    if (cellValue && cellValue.trim() !== '') {
                        // A cell can also hold a second line of text (e.g. typed with
                        // Alt+Enter in Google Sheets). The first line is the real answer
                        // (and is still what gets split on ";" for ties, above); any
                        // line(s) after it are stored as "secondLine" and shown smaller,
                        // underneath the answer, once it's revealed.
                        const cellLines = cellValue.split('\n').map(l => l.trim()).filter(l => l !== '');
                        const mainLine = cellLines[0] || cellValue.trim();
                        const secondLine = cellLines.slice(1).join(' ');
                        const tiedNames = mainLine.split(';').map(s => s.trim()).filter(s => s !== '');
                        const sharedPointValue = rankCounter + 1;
                        tiedNames.forEach(name => {
                            answers.push({
                                text: name,
                                secondLine,
                                pointValue: sharedPointValue, // all tied names share this value
                                rowIndex: row + 1             // Actual Sheet row number for Last Used tracking
                            });
                        });
                        rankCounter += tiedNames.length;
                    }
                }

                if (questionText && answers.length > 0) {
                    buQuestions.push({
                        colIndex: col,
                        questionText,
                        lastUsed,
                        answers
                    });
                }
            }
            return buQuestions;
        };

        // ───────────────────────────────────────────────────────────────────────────────
        // Bottoms Up "can the trailing team still catch up?" check.
        // Every team gets 5 regulation turns. A team's very best possible finish is its
        // current score plus the highest still-unused point values, one per turn it has left
        // (this ignores anything the other team might take, so it's an upper bound - meaning
        // if even THAT can't reach a tie, the round is truly decided). A tie keeps the round
        // going, so a team is only counted out if it can't even TIE.
        // Returns 1 or 2 (the team that has clinched), or null if it's still open.
        //   teamJustWent: the team whose turn just finished (Team 1 always goes first in a turn)
        //   usedValues:   point values already taken (shared by both teams)
        // ───────────────────────────────────────────────────────────────────────────────
        const BOTTOMS_UP_REGULATION_TURNS = 5;
        const getBottomsUpClinchWinner = ({ score1, score2, turnNumber, teamJustWent, usedValues, answers }) => {
            if (!answers || answers.length === 0) return null;
            const team1TurnsDone = turnNumber;                                   // Team 1 goes first each turn
            const team2TurnsDone = teamJustWent === 2 ? turnNumber : turnNumber - 1;
            const turnsLeft1 = Math.max(0, BOTTOMS_UP_REGULATION_TURNS - team1TurnsDone);
            const turnsLeft2 = Math.max(0, BOTTOMS_UP_REGULATION_TURNS - team2TurnsDone);
            // Past regulation (overtime after a tie) there is no "catching up" to calculate -
            // the existing end-of-turn rule already ends it as soon as the scores differ.
            if (turnsLeft1 === 0 && turnsLeft2 === 0) return null;

            const used = new Set(usedValues || []);
            const openValues = [...new Set(answers.map(a => a.pointValue))]
                .filter(v => v > 0 && !used.has(v))
                .sort((a, b) => b - a);
            const bestCase = (turnsLeft) => openValues.slice(0, turnsLeft).reduce((sum, v) => sum + v, 0);

            if (score1 + bestCase(turnsLeft1) < score2) return 2; // Team 1 can't even tie
            if (score2 + bestCase(turnsLeft2) < score1) return 1; // Team 2 can't even tie
            return null;
        };


        // ────────────────────────────────────────────────────────────────
        // LEAGUE RECORDS (hometownstrivialeague.lol) + THUMBNAIL MAKER
        // The league site shows its standings as plain web-page HTML (no data feed), and a browser is
        // not allowed to read another site's pages directly, so the page is fetched through free public
        // "relay" services (tried in turn). Everything that uses this keeps the numbers editable, so a
        // relay being down just means typing the record in.
        // ────────────────────────────────────────────────────────────────
        const LEAGUE_SITE = 'https://hometownstrivialeague.lol/';
        const LEAGUE_RELAYS = [
            (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
            (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
            (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
        ];
        const normTeamName = (n) => String(n || '').toLowerCase().replace(/[^a-z0-9]/g, '');

        // Reads the standings table out of the league homepage HTML: rows like  # | Team | W | L | Diff
        const parseStandingsHtml = (html) => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const seen = new Set();
            const rows = [];
            doc.querySelectorAll('tr').forEach(tr => {
                const cells = Array.from(tr.querySelectorAll('td,th'));
                if (cells.length < 4) return;
                const link = tr.querySelector('a');
                const name = ((link ? link.textContent : cells[1].textContent) || '').replace(/\s+/g, ' ').trim();
                const nums = cells.map(c => c.textContent.trim());
                const w = parseInt(nums[2], 10), l = parseInt(nums[3], 10);
                if (!name || !Number.isFinite(w) || !Number.isFinite(l) || !/^\d+$/.test(nums[2]) || !/^\d+$/.test(nums[3])) return;
                const key = normTeamName(name);
                if (seen.has(key)) return;
                seen.add(key);
                rows.push({ name, w, l });
            });
            // The homepage shows the newest season; its label ("Season 3 underway") tells us which number it is
            const text = (doc.body ? doc.body.textContent : '') || '';
            const under = text.match(/Season\s+(\d+)\s+underway/i);
            let season = under ? parseInt(under[1], 10) : null;
            if (season === null) {
                const all = Array.from(text.matchAll(/Season\s+(\d+)/gi)).map(m => parseInt(m[1], 10));
                season = all.length ? Math.max(...all) : null;
            }
            return { season, rows };
        };

        const fetchLeagueStandings = async () => {
            let lastErr = null;
            for (const relay of LEAGUE_RELAYS) {
                try {
                    const ctl = new AbortController();
                    const timer = setTimeout(() => ctl.abort(), 9000);
                    const res = await fetch(relay(LEAGUE_SITE), { signal: ctl.signal });
                    clearTimeout(timer);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const parsed = parseStandingsHtml(await res.text());
                    if (parsed.rows.length >= 2) return parsed;
                    throw new Error('standings not found in page');
                } catch (e) { lastErr = e; }
            }
            throw lastErr || new Error('no relay worked');
        };

        // The next unplayed week = games played so far + 1 (every team plays once per week)
        const nextWeekFromRows = (rows) => rows.length ? Math.max(...rows.map(r => r.w + r.l)) + 1 : '';

        // Draws the YouTube thumbnail (1280x720) on a canvas: game background, both team logos, the week and the records
        const drawThumbnail = async (canvas, { imagePath, team1, team2, week, rec1, rec2 }) => {
            const W = 1280, H = 720;
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            const load = (src) => new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
            const [bg, logo1, logo2, htl] = await Promise.all([
                load(`${imagePath}background.png`),
                team1 ? load(`${imagePath}${team1.logo}`) : null,
                team2 ? load(`${imagePath}${team2.logo}`) : null,
                load(`${imagePath}htl-logo.png`)
            ]);
            ctx.fillStyle = '#12082a'; ctx.fillRect(0, 0, W, H);
            if (bg) {  // "cover" fit, like the game screen
                const k = Math.max(W / bg.width, H / bg.height);
                ctx.drawImage(bg, (W - bg.width * k) * 0.35, (H - bg.height * k) / 2, bg.width * k, bg.height * k);
            }
            const fit = (img, x, y, size) => {
                const k = Math.min(size / img.width, size / img.height);
                ctx.drawImage(img, x + (size - img.width * k) / 2, y + (size - img.height * k) / 2, img.width * k, img.height * k);
            };
            ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 30;
            if (logo1) fit(logo1, 10, 10, 540);
            if (logo2) fit(logo2, W - 550, 10, 540);
            ctx.restore();
            const stroked = (text, cx, cy, size, maxW) => {
                ctx.font = `900 ${size}px Poppins, Arial Black, Arial, sans-serif`;
                let fs = size;
                while (ctx.measureText(text).width > maxW && fs > 20) { fs -= 4; ctx.font = `900 ${fs}px Poppins, Arial Black, Arial, sans-serif`; }
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(8, fs / 9);
                ctx.strokeStyle = 'black'; ctx.strokeText(text, cx, cy);
                ctx.fillStyle = 'white'; ctx.fillText(text, cx, cy);
            };
            if (rec1) stroked(rec1, 280, 598, 108, 440);
            if (rec2) stroked(rec2, W - 280, 598, 108, 440);
            const wk = String(week || '').trim();
            if (wk) {
                stroked('WEEK', W / 2, 150, 54, 200);
                stroked(wk.toUpperCase(), W / 2, 265, 170, 200);
            }
            if (htl) fit(htl, W / 2 - 95, 365, 190);
        };

        // Host tool (room-code screen): pick two teams + week, records are looked up automatically, then download the PNG
        // ================== PLAYOFF BRACKET (8 teams: 1v8, 4v5, 2v7, 3v6 -> semifinals -> final) ==================
        const BRACKET_SLOT_ORDER = [1, 8, 4, 5, 2, 7, 3, 6];   // seed shown in each of the 8 first-round slots, top to bottom

        // Intro timing. With a bracket scene the logos fly in at 10 seconds and everything after is pushed back by 4 seconds.
        const introPlan = (withBracket) => withBracket
            ? { bg: 1200, steps: [10000, 11500, 13000, 14000, 15000], end: 16000 }
            : { bg: 3500, steps: [6000, 7500, 9000, 10000, 11000], end: 12000 };

        // bySeed: { 1: {id, name, logo, color, elim, seed}, ... } where elim is the time the team was marked eliminated (0/undefined = still alive).
        // A match is decided when exactly one side is eliminated (the other side advances). If both are marked, the one marked LATER
        // is the one that won this match and lost afterwards.
        const resolveBracket = (bySeed) => {
            const r0 = BRACKET_SLOT_ORDER.map(n => bySeed[n] || null);
            const win = (a, b) => {
                if (!a || !b) return null;
                const ea = a.elim || 0, eb = b.elim || 0;
                if (!ea && !eb) return null;
                if (ea && !eb) return b;
                if (eb && !ea) return a;
                return ea > eb ? a : b;
            };
            const w0 = [win(r0[0], r0[1]), win(r0[2], r0[3]), win(r0[4], r0[5]), win(r0[6], r0[7])];
            const w1 = [win(w0[0], w0[1]), win(w0[2], w0[3])];
            const champ = win(w1[0], w1[1]);
            return { cols: [r0, w0, w1, [champ]] };
        };

        // Which match are these two teams about to play? Returns { round, idx } or null.
        const findBracketMatch = (res, id1, id2) => {
            for (let r = 0; r < 3; r++) {
                const col = res.cols[r];
                for (let m = 0; m < col.length / 2; m++) {
                    const a = col[2 * m], b = col[2 * m + 1];
                    if (a && b && ((String(a.id) === String(id1) && String(b.id) === String(id2)) || (String(a.id) === String(id2) && String(b.id) === String(id1)))) return { round: r, idx: m };
                }
            }
            return null;
        };

        // Draws one bracket. compact=true is the small version used in the Seeds window (editor handlers optional);
        // otherwise it is the full-screen intro scene driven by `stage` (1 = shown, 2 = playing teams light up, 3 = they advance, 4 = fades out).
        function BracketDiagram({ bySeed, t1, t2, stage, compact, title, accent, editor, imagePath }) {
            const res = resolveBracket(bySeed);
            const C = compact
                ? { W: 1480, H: 770, top: 74, bot: 8, cw: 340, ch: 66, lp: 10, gap: 375, logo: 46, f: 23, sf: 20, tf: 36 }
                : { W: 3200, H: 1800, top: 250, bot: 60, cw: 660, ch: 130, lp: 70, gap: 770, logo: 104, f: 42, sf: 34, tf: 110 };
            const step = (C.H - C.top - C.bot) / 8;
            const ys = [Array.from({ length: 8 }, (_, i) => C.top + step * (i + 0.5))];
            for (let c = 1; c < 4; c++) ys.push(Array.from({ length: ys[c - 1].length / 2 }, (_, i) => (ys[c - 1][2 * i] + ys[c - 1][2 * i + 1]) / 2));
            const xl = (c) => C.lp + c * C.gap;
            const match = (!compact && t1 && t2) ? findBracketMatch(res, t1, t2) : null;
            const isPlayingTeam = (team) => team && (String(team.id) === String(t1) || String(team.id) === String(t2));
            // only the cards in the round where the two teams actually meet light up (earlier copies of them stay normal)
            const isPlaying = (team, c) => isPlayingTeam(team) && (!match || c === match.round);
            const lit = !compact && stage >= 2;
            const moving = !compact && stage >= 3 && match;

            const cardStyle = (team, c, i) => {
                const playing = isPlaying(team, c);
                const dim = lit && !playing;
                const hideForGhost = moving && playing;
                return {
                    position: 'absolute', left: xl(c), top: ys[c][i] - C.ch / 2, width: C.cw, height: C.ch,
                    display: 'flex', alignItems: 'center', gap: C.ch * 0.12, padding: `0 ${C.ch * 0.14}px`, boxSizing: 'border-box',
                    borderRadius: C.ch * 0.16, borderWidth: compact ? 3 : 5, borderStyle: team ? 'solid' : 'dashed',
                    borderColor: team ? (lit && playing ? '#facc15' : (team.color || '#7d3ad4')) : '#4b5563',
                    backgroundColor: team ? 'rgba(8,12,28,0.9)' : 'rgba(8,12,28,0.45)',
                    boxShadow: lit && playing ? '0 0 60px 12px rgba(250,204,21,0.75)' : 'none',
                    transform: lit && playing ? 'scale(1.06)' : 'scale(1)',
                    filter: team && team.elim ? 'grayscale(1)' : 'none',
                    opacity: hideForGhost ? 0.1 : (team && team.elim ? 0.45 : (dim ? 0.28 : 1)),
                    transition: 'all 0.7s ease', color: 'white', fontWeight: 800, overflow: 'hidden', cursor: editor && team ? 'pointer' : 'default'
                };
            };
            const cardInner = (team, seedLabel) => team ? (
                <>
                    <span style={{ fontSize: C.sf, color: '#fbbf24', width: C.sf * 1.7, textAlign: 'center', flexShrink: 0 }}>{team.seed || seedLabel}</span>
                    <img src={`${imagePath}${team.logo}`} alt="" style={{ width: C.logo, height: C.logo, objectFit: 'contain', flexShrink: 0 }} />
                    <span style={{ fontSize: C.f, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', textDecoration: team.elim ? 'line-through' : 'none' }}>{team.name}</span>
                </>
            ) : <span style={{ fontSize: C.sf, color: '#6b7280', width: '100%', textAlign: 'center' }}>{seedLabel}</span>;

            // connector lines
            const lines = [];
            for (let c = 0; c < 3; c++) {
                for (let m = 0; m < ys[c + 1].length; m++) {
                    const ya = ys[c][2 * m], yb = ys[c][2 * m + 1], yn = ys[c + 1][m];
                    const x1 = xl(c) + C.cw, xm = x1 + (C.gap - C.cw) / 2, x2 = xl(c + 1);
                    lines.push(<path key={`g${c}-${m}`} d={`M ${x1} ${ya} H ${xm} V ${yn} H ${x2} M ${x1} ${yb} H ${xm}`} stroke="#4b5563" strokeWidth={compact ? 3 : 6} fill="none" />);
                    const w = res.cols[c + 1][m];
                    if (w) {
                        const yw = res.cols[c][2 * m] === w ? ya : yb;
                        lines.push(<path key={`w${c}-${m}`} d={`M ${x1} ${yw} H ${xm} V ${yn} H ${x2}`} stroke="#facc15" strokeWidth={compact ? 4 : 8} fill="none" />);
                    }
                }
            }

            // ghosts: the two playing teams slide to the meeting spot of their match
            const ghosts = [];
            let vs = null;
            if (match) {
                const r = match.round, m = match.idx;
                const src = [res.cols[r][2 * m], res.cols[r][2 * m + 1]];
                const nodeY = ys[r + 1][m];
                const offs = [-(C.ch / 2 + 10), (C.ch / 2 + 10)];
                src.forEach((team, k) => {
                    const sy = ys[r][2 * m + k];
                    ghosts.push(
                        <div key={`gh${k}`} style={{
                            ...cardStyle(team, r, 2 * m + k), opacity: stage >= 2 ? 1 : 0, filter: 'none',
                            left: moving ? xl(r + 1) : xl(r), top: (moving ? nodeY + offs[k] : sy) - C.ch / 2,
                            transform: 'scale(1.06)', transition: 'left 1.1s ease-in-out, top 1.1s ease-in-out, opacity 0.5s ease', zIndex: 5
                        }}>{cardInner(team, '')}</div>
                    );
                });
                vs = (
                    <div style={{
                        position: 'absolute', left: xl(r + 1) + C.cw / 2 - C.ch * 0.4, top: nodeY - C.ch * 0.4, width: C.ch * 0.8, height: C.ch * 0.8,
                        borderRadius: '50%', backgroundColor: '#dc2626', border: `${compact ? 3 : 6}px solid white`, color: 'white', fontWeight: 900,
                        fontSize: C.f * 0.9, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 6,
                        opacity: moving ? 1 : 0, transform: moving ? 'scale(1)' : 'scale(0.2)', transition: 'all 0.6s ease 0.9s'
                    }}>VS</div>
                );
            }

            return (
                <div style={{ position: 'relative', width: C.W, height: C.H, fontFamily: 'Poppins, Arial, sans-serif' }}>
                    <div style={{ position: 'absolute', left: 0, right: 0, top: compact ? 6 : 50, textAlign: 'center', fontSize: C.tf, fontWeight: 900, color: accent || 'white', letterSpacing: '0.04em',
                        WebkitTextStroke: compact ? '0' : '6px black', paintOrder: 'stroke fill' }}>{title}</div>
                    <svg width={C.W} height={C.H} style={{ position: 'absolute', left: 0, top: 0 }}>{lines}</svg>
                    {res.cols.map((col, c) => col.map((team, i) => {
                        const seedLabel = c === 0 ? `#${BRACKET_SLOT_ORDER[i]}` : 'TBD';
                        // hide the empty meeting-spot card while the playing teams occupy it
                        if (!team && moving && c === match.round + 1 && i === match.idx) return null;
                        const ed = editor && c === 0 ? editor : null;
                        const seedIdx = BRACKET_SLOT_ORDER[i] - 1;
                        return (
                            <div key={`${c}-${i}`} style={cardStyle(team, c, i)}
                                draggable={!!(ed && team)}
                                onDragStart={ed && team ? ed.dragStart(team, seedIdx) : undefined}
                                onDragOver={ed ? ed.allowDrop : undefined}
                                onDrop={ed ? ed.drop(seedIdx) : undefined}
                                onClick={editor && team ? () => editor.toggleElim(team) : undefined}>
                                {cardInner(team, seedLabel)}
                            </div>
                        );
                    }))}
                    {ghosts}
                    {vs}
                </div>
            );
        }

        // A compact drop-down that lives inside the page (the browser's own pop-up menu gets blown up by the 3200x1800 canvas scaling).
        function DropSelect({ value, options, placeholder, onChange, fontSize = 26 }) {
            const [open, setOpen] = useState(false);
            const boxRef = useRef(null);
            const cur = options.find(o => String(o.value) === String(value));
            // Close when you click anywhere outside the menu (or press Escape). Uses the whole document, so
            // other buttons (like CLOSE) still receive the same click.
            useEffect(() => {
                if (!open) return;
                const onDown = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
                const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
                document.addEventListener('mousedown', onDown, true);
                document.addEventListener('keydown', onKey);
                return () => { document.removeEventListener('mousedown', onDown, true); document.removeEventListener('keydown', onKey); };
            }, [open]);
            return (
                <div ref={boxRef} style={{position: 'relative', width: '100%', minWidth: 0}}>
                    <button type="button" onClick={() => setOpen(o => !o)}
                        className="bg-gray-800 text-white rounded border-2 border-gray-600 w-full flex items-center justify-between text-left"
                        style={{fontSize: fontSize + 'px', padding: '10px 14px'}}>
                        <span style={{color: cur ? 'white' : '#9ca3af'}}>{cur ? cur.label : placeholder}</span>
                        <span style={{fontSize: (fontSize - 6) + 'px', color: '#9ca3af'}}>{open ? '\u25B2' : '\u25BC'}</span>
                    </button>
                    {open && (
                        <>
                            <div className="bg-gray-800 border-2 border-gray-500 rounded" style={{position: 'absolute', left: 0, right: 0, top: '100%', marginTop: '4px', zIndex: 10002, maxHeight: '280px', overflowY: 'auto', boxShadow: '0 8px 24px rgba(0,0,0,0.6)'}}>
                                {options.map(o => (
                                    <div key={o.value} onClick={(e) => { e.preventDefault(); e.stopPropagation(); onChange(o.value); setOpen(false); }}
                                        className="text-white hover:bg-purple-700 cursor-pointer"
                                        style={{fontSize: (fontSize - 2) + 'px', padding: '8px 14px', backgroundColor: String(o.value) === String(value) ? '#4c1d95' : undefined}}>
                                        {o.label}
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function ThumbnailMaker({ teamsData, imagePath, onClose }) {
            const [t1, setT1] = useState('');
            const [t2, setT2] = useState('');
            const [week, setWeek] = useState('');
            const [rec1, setRec1] = useState('');
            const [rec2, setRec2] = useState('');
            const [status, setStatus] = useState('');
            const [busy, setBusy] = useState(false);
            const canvasRef = useRef(null);
            const team = (id) => teamsData.find(t => String(t.id) === String(id)) || null;

            const lookup = async (a, b) => {
                const A = team(a), B = team(b);
                if (!A && !B) return;
                setBusy(true); setStatus('Looking up records on hometownstrivialeague.lol...');
                try {
                    const { season, rows } = await fetchLeagueStandings();
                    const find = (t) => t && rows.find(r => normTeamName(r.name) === normTeamName(t.name));
                    const r1 = find(A), r2 = find(B);
                    if (r1) setRec1(`${r1.w}-${r1.l}`);
                    if (r2) setRec2(`${r2.w}-${r2.l}`);
                    setWeek(String(nextWeekFromRows(rows)));
                    const missing = [A && !r1 ? A.name : null, B && !r2 ? B.name : null].filter(Boolean);
                    setStatus(`Season ${season || '?'} standings loaded.` + (missing.length ? ` Couldn't find: ${missing.join(', ')} - type the record in.` : ''));
                } catch (e) {
                    setStatus("Couldn't reach the league site right now - type the week and records in.");
                }
                setBusy(false);
            };

            useEffect(() => {
                if (canvasRef.current) drawThumbnail(canvasRef.current, { imagePath, team1: team(t1), team2: team(t2), week, rec1, rec2 });
            }, [t1, t2, week, rec1, rec2]);

            const download = () => {
                if (!canvasRef.current) return;
                canvasRef.current.toBlob((blob) => {
                    if (!blob) { setStatus('Could not create the image (a picture failed to load). Try again.'); return; }
                    const a = document.createElement('a');
                    const slug = (t) => (t ? t.name.replace(/[^A-Za-z0-9]+/g, '') : 'Team');
                    a.href = URL.createObjectURL(blob);
                    a.download = `HTL-Week${String(week || '').replace(/[^A-Za-z0-9]/g, '')}-${slug(team(t1))}-vs-${slug(team(t2))}.png`;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
                }, 'image/png');
            };

            const field = { fontSize: '26px', padding: '10px 14px', width: '100%', minWidth: 0 };
            return (
                <div className="absolute inset-0 flex items-center justify-center" style={{backgroundColor: 'rgba(0,0,0,0.9)', zIndex: 10000}}>
                    <div className="bg-gray-900 rounded-3xl border-8 flex gap-8" style={{borderColor: '#7d3ad4', padding: '36px', width: '2500px'}}>
                        <div style={{width: '1280px'}}>
                            <canvas ref={canvasRef} style={{width: '1280px', height: '720px', borderRadius: '12px', border: '3px solid #374151'}} />
                            <div className="text-gray-400" style={{fontSize: '22px', marginTop: '10px'}}>1280 x 720 PNG - ready for YouTube</div>
                        </div>
                        <div className="flex flex-col gap-4 flex-1 text-white" style={{minWidth: 0}}>
                            <h2 className="font-bold" style={{fontSize: '48px'}}>Thumbnail Maker</h2>
                            {[['Team 1', t1, setT1, (v) => lookup(v, t2)], ['Team 2', t2, setT2, (v) => lookup(t1, v)]].map(([label, val, set, after]) => (
                                <div key={label} className="flex flex-col" style={{fontSize: '24px'}}>
                                    {label}
                                    <DropSelect value={val} placeholder="Choose a team..." onChange={(v) => { set(v); after(v); }}
                                        options={teamsData.map(t => ({ value: t.id, label: t.name }))} />
                                </div>
                            ))}
                            <div className="flex gap-4">
                                <label className="flex flex-col flex-1" style={{fontSize: '24px'}}>Week
                                    <input value={week} onChange={(e) => setWeek(e.target.value)} className="bg-gray-800 rounded border-2 border-gray-600" style={field} />
                                </label>
                                <label className="flex flex-col flex-1" style={{fontSize: '24px'}}>Team 1 record
                                    <input value={rec1} onChange={(e) => setRec1(e.target.value)} placeholder="7-4" className="bg-gray-800 rounded border-2 border-gray-600" style={field} />
                                </label>
                                <label className="flex flex-col flex-1" style={{fontSize: '24px'}}>Team 2 record
                                    <input value={rec2} onChange={(e) => setRec2(e.target.value)} placeholder="5-6" className="bg-gray-800 rounded border-2 border-gray-600" style={field} />
                                </label>
                            </div>
                            <button onClick={() => lookup(t1, t2)} disabled={busy || (!t1 && !t2)} className="bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg border-2 border-gray-500" style={{fontSize: '26px', padding: '12px'}}>
                                ↻ Look up records again
                            </button>
                            <div className="text-yellow-300" style={{fontSize: '22px', minHeight: '60px'}}>{status}</div>
                            <div className="flex gap-4 mt-auto">
                                <button onClick={download} disabled={!t1 || !t2} className={`flex-1 font-bold rounded-lg border-4 border-black ${t1 && t2 ? 'bg-green-500 hover:bg-green-600 text-white' : 'bg-gray-600 text-gray-400'}`} style={{fontSize: '34px', padding: '18px'}}>
                                    ⬇ DOWNLOAD PNG
                                </button>
                                <button onClick={onClose} className="bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg border-4 border-black" style={{fontSize: '34px', padding: '18px 40px'}}>
                                    CLOSE
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function TriviaGame() {
            const [team1Score, setTeam1Score] = useState(0);
            const [team2Score, setTeam2Score] = useState(0);
            const [currentRound, setCurrentRound] = useState(1);
            const [currentQuestion, setCurrentQuestion] = useState(1);
            const [showCategory, setShowCategory] = useState(false);
            const [showQuestion, setShowQuestion] = useState(false);
            const [showAnswer, setShowAnswer] = useState(false);
            const [activeTeam, setActiveTeam] = useState(1);
            const [stealAttempted, setStealAttempted] = useState(false);
            
            // Timer states
            const [team1Time, setTeam1Time] = useState(30);
            const [team2Time, setTeam2Time] = useState(15);
            const [timerRunning, setTimerRunning] = useState(false);
            const [activeTimer, setActiveTimer] = useState(1);
            
            const questionTextRef = useRef(null);
            const answerTextRef = useRef(null);
            
            // Powerups state
            const [team1Powerups, setTeam1Powerups] = useState({
                extraTime: true,
                pointDoubler: true,
                doubleDip: true
            });
            
            const [team2Powerups, setTeam2Powerups] = useState({
                extraTime: true,
                pointDoubler: true,
                doubleDip: true
            });

            const [currentPointValue, setCurrentPointValue] = useState(1);

            const [powerupPhase, setPowerupPhase] = useState(false);
            const [powerupTimer, setPowerupTimer] = useState(30);
            const [team1DoublerActive, setTeam1DoublerActive] = useState(false);
            const [team2DoublerActive, setTeam2DoublerActive] = useState(false);
            const [team1ExtraTimeActive, setTeam1ExtraTimeActive] = useState(false);
            const [team2ExtraTimeActive, setTeam2ExtraTimeActive] = useState(false);
            
            // Team selection states

                                setTeamRecords(gameState.teamRecords || {});
                                setBracketInfoState(gameState.bracketInfo || null);
                                if (gameState.seriesInfo) {
                                    setSeasonType(gameState.seriesInfo.seasonType || 'regular');
                                    setTotalMatches(gameState.seriesInfo.totalMatches || 1);
                                    setSeriesMatchIndex(gameState.seriesInfo.matchIndex || 0);
                                    setSeriesWins(gameState.seriesInfo.wins || {});
                                    setPlayoffNoticeDismissed(!!gameState.seriesInfo.noticeDismissed);
                                }
                                // Countdown and intro states no longer synced via gameState
                                // Stream runs its own local sequence triggered by matchStartTimestamp
                                
                                if (gameState.teamsConfirmed && !gameState.gameStarted) {
                                    setTeamsConfirmed(true);
                                }
                                if (gameState.teamsConfirmed) {
                                    setTeamsConfirmed(true);
                                }
                                if (gameState.gameStarted) {
                                    // If gameStarted before our local sequence finishes, host clicked Skip
                                    const stillEarly = Date.now() < streamSeqEndAtRef.current - 2500;   // arrived well before our intro finished = real Skip
                                    if (streamIntroStartedRef.current && !streamSeriesIntroRef.current && stillEarly) {
                                        streamSkipRef.current = true;
                                        // Stop audio
                                        if (streamAudioRef.current) {
                                            streamAudioRef.current.pause();
                                            streamAudioRef.current = null;
                                        }
                                        if (teamAnnounceAudioRef.current) {
                                            teamAnnounceAudioRef.current.pause();
                                            teamAnnounceAudioRef.current = null;
                                        }
                                        // Clear all intro states
                                        setShowCountdown(false);
                                        setShowIntro(false);
                                        setCountdownFading(false);
                                        setCountdownFlipping(false);
                                        setBackgroundFading(false);
                                        setWhiteFading(false);
                                    }
                                    setGameStarted(true);
                                    setTeamsConfirmed(true);
                                }
                            }
                        });

                        // Also watch matchStartTimestamp to trigger local countdown+intro
                        const tsRef = database.ref(`rooms/${roomCode}/matchStartTimestamp`);

                        // Before attaching the listener above, check ONCE whether this Stream is
                        // rejoining a match that's already in progress (e.g. a page refresh mid-game).
                        // matchStartTimestamp is never cleared from Firebase, so without this check
                        // the listener below would replay the full countdown/intro/audio sequence
                        // every time the Stream reconnects, even well into Round 1 or later.
                        // We wait for this check to finish before attaching tsRef.on(...) so there's
                        // no race between the two - it's not enough to just start the check earlier,
                        // since matchStartTimestamp is a single small value and often loads faster
                        // than the full gameState object we're checking here.
                        gameStateRef.once('value').then((existingSnapshot) => {
                        const existingState = existingSnapshot.val();
                        if (existingState && existingState.gameStarted) {
                            streamIntroStartedRef.current = true;
                        }

                        tsRef.on('value', (snapshot) => {
                            const ts = snapshot.val();
                            if (!ts || streamIntroStartedRef.current) return;
                            console.log('🚀 Stream received matchStartTimestamp, starting local sequence');
                            streamIntroStartedRef.current = true;
                            streamSeqEndAtRef.current = Date.now() + 60000;   // refined once the intro itself starts
                            
                            if (!streamAudioRef.current) {
                                streamAudioRef.current = new Audio(`${audioPath}countdown.mp3`);
                                streamAudioRef.current.volume = 1.0;
                                streamAudioRef.current.play().catch(e => console.log('Audio failed:', e.message));
                            }
                            
                            const elapsed = Math.max(0, Date.now() - ts);
                            
                            setShowCountdown(true);
                            // Show countdown screen immediately (black during 2.5s audio lead-in)
                            setShowCountdown(true);
                            setCountdownNumber(null);
                            setCountdownFlipping(false);
                            
                            // Timestamp written 2500ms before "10" appears, so offset countdown by 2500ms
                            const visualStart = 2500;
                            for (let i = 0; i < 10; i++) {
                                const num = 10 - i;
                                setTimeout(() => {
                                    if (streamSkipRef.current) return;
                                    setCountdownFlipping(false);
                                    setCountdownNumber(num);
                                }, Math.max(0, visualStart + i * 1000 - elapsed));
                                setTimeout(() => {
                                    if (streamSkipRef.current) return;
                                    setCountdownFlipping(true);
                                }, Math.max(0, visualStart + i * 1000 + 850 - elapsed));
                            }
                            
                            setTimeout(() => {
                                if (streamSkipRef.current) return;
                                setCountdownFading(true);
                                setTimeout(() => {
                                    if (streamSkipRef.current) return;
                                    setCountdownFading(false);
                                    setShowCountdown(false);
                                    setWhiteFading(true);
                                    setBackgroundFading(true);
                                    setShowIntro(true);
                                    const plan = introPlan(introHasBracketRef.current);
                                    streamSeqEndAtRef.current = Date.now() + plan.end;
                                    // Play Team Announcement audio at white flash peak
                                    if (shouldPlayOnce('announce', 25000)) {
                                        const announceAudio = new Audio(`${audioPath}Team Announcement.mp3`);
                                        announceAudio.volume = 1.0;
                                        teamAnnounceAudioRef.current = announceAudio;
                                        announceAudio.play().catch(() => {});
                                    }
                                    setTimeout(() => { if (!streamSkipRef.current) setWhiteFading(false); }, 1500);
                                    setTimeout(() => { if (!streamSkipRef.current) setBackgroundFading(false); }, plan.bg);
                                    plan.steps.forEach((ms, k) => setTimeout(() => { if (!streamSkipRef.current) setIntroStep(k + 1); }, ms));
                                    setTimeout(() => { if (!streamSkipRef.current) setShowIntro(false); }, plan.end);
                                }, 2000);
                            }, Math.max(0, visualStart + 10000 - elapsed));
                        });
                        });

                        // Between matches in a multi-match session the Host writes `nextIntro`; the Stream then
                        // plays its own copy of the intro (white flash, logos fly in, Round 1) - no countdown.
                        const introRef = database.ref(`rooms/${roomCode}/nextIntro`);
                        let lastIntroN = null;
                        let introReady = false;
                        introRef.on('value', (snap) => {
                            const v = snap.val();
                            if (!introReady) { introReady = true; lastIntroN = v ? v.n : null; return; }   // ignore what was already there when we joined
                            if (!v || v.n === lastIntroN) return;
                            lastIntroN = v.n;
                            streamSeriesIntroRef.current = true;
                            streamSkipRef.current = false;
                            const plan = introPlan(introHasBracketRef.current);
                            streamSeqEndAtRef.current = Date.now() + plan.end;
                            setShowCountdown(false);
                            setIntroStep(0);
                            setWhiteFading(true);
                            setBackgroundFading(true);
                            setShowIntro(true);
                            try {
                                if (teamAnnounceAudioRef.current) { teamAnnounceAudioRef.current.pause(); teamAnnounceAudioRef.current = null; }
                                if (shouldPlayOnce('announce', 25000)) {
                                    const announceAudio = new Audio(`${audioPath}Team Announcement.mp3`);
                                    announceAudio.volume = 1.0;
                                    teamAnnounceAudioRef.current = announceAudio;
                                    announceAudio.play().catch(() => {});
                                }
                            } catch (e) {}
                            setTimeout(() => { if (!streamSkipRef.current) setWhiteFading(false); }, 1500);
                            setTimeout(() => { if (!streamSkipRef.current) setBackgroundFading(false); }, plan.bg);
                            plan.steps.forEach((ms, k) => setTimeout(() => { if (!streamSkipRef.current) setIntroStep(k + 1); }, ms));
                            setTimeout(() => { if (!streamSkipRef.current) setShowIntro(false); streamSeriesIntroRef.current = false; }, plan.end);
                        });

                        return () => {
                            gameStateRef.off();
                            tsRef.off();
                            introRef.off();
                        };
                    }
                }
            }, [userMode, roomCode, shouldConnect]);

            // PLAYOFFS: the bracket these two teams belong to (needs both teams placed in the SAME bracket with seeds).
            const hostBracketInfo = (() => {
                if (seasonType !== 'playoff' || !selectedTeam1 || !selectedTeam2) return null;
                const a = leagueSeeds[selectedTeam1.id], b = leagueSeeds[selectedTeam2.id];
                if (!a || !b || !a.bracket || a.bracket !== b.bracket) return null;
                const bySeed = {};
                teamsData.forEach(t => {
                    const e = leagueSeeds[t.id];
                    if (e && e.bracket === a.bracket && e.seed >= 1 && e.seed <= 8) bySeed[e.seed] = { id: t.id, name: t.name, logo: t.logo, color: t.color || '#7d3ad4', elim: e.elim || 0, seed: e.seed };
                });
                return { name: a.bracket, teams: bySeed, t1: selectedTeam1.id, t2: selectedTeam2.id };
            })();
            const bracketForIntro = userMode === 'host' ? hostBracketInfo : bracketInfoState;
            introHasBracketRef.current = seasonType === 'playoff' && !!bracketForIntro;
            const bracketKey = JSON.stringify(hostBracketInfo);
            // Bracket scene timing inside the intro (same on Host and Stream)
            useEffect(() => {
                setBracketStage(0);
                if (!showIntro || !introHasBracketRef.current) return;
                const timers = [
                    setTimeout(() => setBracketStage(1), 3300),
                    setTimeout(() => setBracketStage(2), 4800),
                    setTimeout(() => setBracketStage(3), 6000),
                    setTimeout(() => setBracketStage(4), 9300)
                ];
                return () => timers.forEach(clearTimeout);
            }, [showIntro]);

            // Auto-broadcast game state when it changes (HOST only)
            useEffect(() => {
                if (userMode === 'host' && isConnected && roomCode && (gameStarted || showCountdown || showIntro || backgroundFading || whiteFading)) {
                    broadcastGameState();
                }
            }, [
                selectedTeam1, selectedTeam2, selectedMatch, bonusType,
                team1Score, team2Score, currentRound, currentQuestion,
                showCategory, showQuestion, showAnswer, activeTeam,
                team1Time, team2Time, timerRunning, powerupPhase,
                powerupTimer,
                team1Powerups, team2Powerups, bonusScore1, bonusScore2,
                bonusQuestionIndex, showBonusAnswer, showDistances, team1Guess, team2Guess,
                team1GuessSubmitted, team2GuessSubmitted, shootoutBoardRevealed, shootoutRevealedAnswers,
                shootoutShuffledAnswers, shootoutTurnCount, shootoutActiveTeam, shootoutSuddenDeath,
                isTieBreaker, tieBreakerType, teamsConfirmed, gameStarted, showIntro,
                showWinnerScreen, winnerTeam, userMode, roomCode,
                showCountdown, countdownNumber, countdownFlipping, countdownFading,
                backgroundFading, whiteFading, introStep,
                bottomsUpAnimating, bottomsUpAnimationValue, bottomsUpPhase,
                bottomsUpFlyingScore, bottomsUpShowAnswer, bottomsUpGlowing,
                bottomsUpConfirmedAnswer, bottomsUpActiveTeam, bottomsUpUsedAnswers, bottomsUpTurnNumber,
                // Questions themselves: so a live edit pulled in from Google Sheets reaches the Stream right away
                closestToQuestions, closestToBase, closestToConsumed, bottomsUpQuestion, tieBreakerBottomsUpQuestion,
                selectedShootoutQuestion, selectedTieBreakerShootoutQuestion,
                // Multi-match sessions / playoffs
                seasonType, totalMatches, seriesMatchIndex, seriesOrder, seriesWins, seriesRecorded, playoffNoticeDismissed, teamRecords, bracketKey
            ]);
            
            // Intro animation sequence
            useEffect(() => {
                if (showIntro && userMode === 'host') {
                    const plan = introPlan(introHasBracketRef.current);
                    const timers = [
                        ...plan.steps.map((ms, k) => setTimeout(() => { if (!skipIntroRef.current) setIntroStep(k + 1); }, ms)),
                        setTimeout(() => {
                            if (!skipIntroRef.current) {
                                setShowIntro(false);
                                setGameStarted(true);
                            }
                        }, plan.end)
                    ];
                    return () => timers.forEach(timer => clearTimeout(timer));
                }
            }, [showIntro, userMode]);

            // Stream plays Winner.mp3 when winner screen appears
            useEffect(() => {
                if (userMode !== 'stream') return;
                if (showWinnerScreen) {
                    if (!winnerAudioRef.current && shouldPlayOnce('winner', 3000)) {
                        const winnerAudio = new Audio(`${audioPath}Winner.mp3`);
                        winnerAudio.volume = 1.0;
                        winnerAudioRef.current = winnerAudio;
                        winnerAudio.play().catch(() => {});
                    }
                } else if (winnerAudioRef.current) {
                    // next match is starting: the end-of-match sound must not play over the intro
                    try { winnerAudioRef.current.pause(); } catch (e) {}
                    winnerAudioRef.current = null;
                }
            }, [userMode, showWinnerScreen]);

            // Stream plays soundbar audio based on host controls
            useEffect(() => {
                if (userMode !== 'stream') return;
                const LIGHTS_DOWN = 'Lights Down.mp3';

                if (currentTrack && isPlaying) {
                    if (!soundbarAudioRef.current || soundbarAudioRef.current._track !== currentTrack) {
                        // New track selected - create new audio
                        if (soundbarAudioRef.current) {
                            soundbarAudioRef.current.pause();
                        }
                        soundbarAudioRef.current = new Audio(`${audioPath}${currentTrack}`);
                        soundbarAudioRef.current._track = currentTrack;
                        soundbarAudioRef.current.currentTime = trackPosition;
                        soundbarAudioRef.current.loop = (currentTrack !== LIGHTS_DOWN);
                        soundbarAudioRef.current.volume = soundbarVolume;
                        soundbarAudioRef.current.play().catch(() => {});
                    } else {
                        // Same track - just resume from saved position
                        soundbarAudioRef.current.currentTime = trackPosition;
                        soundbarAudioRef.current.play().catch(() => {});
                    }
                } else if (!isPlaying && soundbarAudioRef.current) {
                    soundbarAudioRef.current.pause();
                }
                if (!currentTrack && soundbarAudioRef.current) {
                    soundbarAudioRef.current.pause();
                    soundbarAudioRef.current.currentTime = 0;
                    soundbarAudioRef.current = null;
                }
            }, [userMode, currentTrack, isPlaying, trackPosition]);

            // Stream: keep the currently playing soundbar track's volume in sync
            // with the Host's slider in real time, without restarting playback.
            useEffect(() => {
                if (userMode === 'stream' && soundbarAudioRef.current) {
                    soundbarAudioRef.current.volume = soundbarVolume;
                }
            }, [userMode, soundbarVolume]);

            // Host: stop any soundbar track the moment the winner reveal begins,
            // so Winner.mp3 is the only thing playing (no overlap).
            useEffect(() => {
                if (userMode === 'host' && showWinnerScreen && (currentTrack || isPlaying)) {
                    setCurrentTrack(null);
                    setIsPlaying(false);
                    setTrackPosition(0);
                    if (roomCode) {
                        database.ref(`rooms/${roomCode}/gameState`).update({
                            currentTrack: null,
                            isPlaying: false,
                            trackPosition: 0,
                        });
                    }
                }
            }, [userMode, showWinnerScreen]);

            // Animate waiting dots for stream waiting screen
            useEffect(() => {
                if (userMode === 'stream' && !gameStarted && !showIntro) {
                    const interval = setInterval(() => {
                        setWaitingDots(prev => {
                            if (prev === '.') return '..';
                            if (prev === '..') return '...';
                            return '.';
                        });
                    }, 500); // Change every 500ms
                    
                    return () => clearInterval(interval);
                }
            }, [userMode, gameStarted, showIntro]);

            // Fetch all data from Google Sheets
            const fetchSheetsData = async () => {
                setSheetsLoading(true);
                setSheetsError(null);
                
                try {
                    // First, get the list of all tabs (sheets) in the spreadsheet
                    const metaUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}?key=${SHEETS_API_KEY}`;
                    const metaResponse = await fetch(metaUrl);
                    
                    if (!metaResponse.ok) {
                        throw new Error('Failed to connect to Google Sheets. Check your API key and Sheet ID.');
                    }
                    
                    const metaData = await metaResponse.json();
                    const allSheets = metaData.sheets
                        .filter(s => !s.properties.hidden)
                        .map(s => s.properties.title);
                    
                    // Separate match tabs from bonus tabs
                    const matchTabs = allSheets.filter(name => name.toUpperCase().startsWith('MATCH'));
                    const closestToTab = allSheets.find(name => name.toUpperCase() === 'CLOSEST TO');
                    const shootoutTab = allSheets.find(name => name.toUpperCase() === 'SHOOTOUT');
                    const bottomsUpTab = allSheets.find(name => name.toUpperCase() === 'BOTTOMS UP');
                    const hasClosestTo = !!closestToTab;
                    const hasShootout = !!shootoutTab;
                    const hasBottomsUp = !!bottomsUpTab;
                    // Remember the tab names so the live "refresh questions" feature can re-read just
                    // the tabs it needs later without asking Google for the tab list again.
                    sheetTabsRef.current = { matchTabs, closestToTab, shootoutTab, bottomsUpTab };

                    // --- LOAD MATCH TABS ---
                    const loadedMatches = [];
                    
                    for (const tabName of matchTabs) {
                        const matchName = tabName.substring(5).trim(); // Remove "MATCH" prefix
                        
                        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(tabName)}!A2:F25?key=${SHEETS_API_KEY}`;
                        const response = await fetch(url);
                        const data = await response.json();
                        const rows = data.values || [];
                        
                        // Parse rows into rounds (rules live in parseMatchRows, near the top of the file)
                        const rounds = parseMatchRows(rows);

                        loadedMatches.push({
                            id: tabName,
                            name: matchName,
                            rounds: rounds
                        });
                    }
                    
                    setSheetsMatches(loadedMatches);
                    
                    // --- LOAD CLOSEST TO TAB ---
                    if (hasClosestTo) {
                        const ctUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(closestToTab)}!A2:C1000?key=${SHEETS_API_KEY}`;
                        const ctResponse = await fetch(ctUrl);
                        const ctData = await ctResponse.json();
                        const ctRows = ctData.values || [];
                        
                        // Skip Row 1 (labels), load all questions (rules live in parseClosestToRows)
                        const questions = parseClosestToRows(ctRows);

                        // Shuffle so they come out in random order each game
                        const shuffled = questions.sort(() => Math.random() - 0.5);
                        setClosestToQuestions(shuffled);
                    }
                    
                    // --- LOAD SHOOTOUT TAB ---
                    if (hasShootout) {
                        const soUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(shootoutTab)}!A1:Z200?key=${SHEETS_API_KEY}`;
                        const soResponse = await fetch(soUrl);
                        const soData = await soResponse.json();
                        const soRows = soData.values || [];
                        
                        if (soRows.length > 0) {
                            // Rules live in parseShootoutRows (near the top of the file)
                            setShootoutQuestions(parseShootoutRows(soRows));
                        }
                    }

                    // --- LOAD BOTTOMS UP TAB ---
                    if (hasBottomsUp) {
                        const buUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(bottomsUpTab)}!A1:Z200?key=${SHEETS_API_KEY}`;
                        const buResponse = await fetch(buUrl);
                        const buData = await buResponse.json();
                        const buRows = buData.values || [];
                        
                        if (buRows.length > 0) {
                            // Rules (tied answers split on ";", second lines, point values) live in
                            // parseBottomsUpRows, near the top of the file
                            const buQuestions = parseBottomsUpRows(buRows);
                            setBottomsUpQuestions(buQuestions);
                            console.log(`✅ Loaded ${buQuestions.length} Bottoms Up questions`);
                        }
                    }
                    
                    setSheetsLoading(false);
                    console.log('✅ Google Sheets data loaded successfully');
                    
                } catch (error) {
                    console.error('❌ Error loading Google Sheets data:', error);
                    setSheetsError(error.message);
                    setSheetsLoading(false);
                }
            };

            // Restore full game state from Firebase data (used when resuming a saved session)
            const restoreGameState = (gameState) => {
                setIsResuming(true);
                setTimeout(() => setIsResuming(false), 500);
                setSelectedTeam1(gameState.selectedTeam1);
                setSelectedTeam2(gameState.selectedTeam2);
                setSelectedMatch(gameState.selectedMatch);
                setBonusType(gameState.bonusType);
                setTieBreakerType(gameState.tieBreakerType);
                setTeam1Score(gameState.team1Score);
                setTeam2Score(gameState.team2Score);
                setCurrentRound(gameState.currentRound);
                setCurrentQuestion(gameState.currentQuestion);
                setShowCategory(gameState.showCategory);
                setShowQuestion(gameState.showQuestion);
                setShowAnswer(gameState.showAnswer);
                setActiveTeam(gameState.activeTeam);
                setActiveTimer(gameState.activeTimer || 1);
                setTeam1Time(gameState.team1Time);
                setTeam2Time(gameState.team2Time);
                setTimerRunning(false); // Always start paused when resuming
                setPowerupPhase(gameState.powerupPhase);
                setPowerupTimer(gameState.powerupTimer);
                setTeam1Powerups(gameState.team1Powerups);
                setTeam2Powerups(gameState.team2Powerups);
                setBonusScore1(gameState.bonusScore1);
                setBonusScore2(gameState.bonusScore2);
                setBonusQuestionIndex(gameState.bonusQuestionIndex);
                setShowBonusAnswer(gameState.showBonusAnswer);
                setTeam1Guess(gameState.team1Guess || '');
                setTeam2Guess(gameState.team2Guess || '');
                setTeam1GuessSubmitted(gameState.team1GuessSubmitted);
                setTeam2GuessSubmitted(gameState.team2GuessSubmitted);
                setShootoutBoardRevealed(gameState.shootoutBoardRevealed);
                setShootoutRevealedAnswers(gameState.shootoutRevealedAnswers || []);
                setShootoutShuffledAnswers(gameState.shootoutShuffledAnswers || []);
                setShootoutTurnCount(gameState.shootoutTurnCount);
                setShootoutActiveTeam(gameState.shootoutActiveTeam);
                setShootoutSuddenDeath(gameState.shootoutSuddenDeath);
                setIsTieBreaker(gameState.isTieBreaker);
                setShowWinnerScreen(gameState.showWinnerScreen);
                setWinnerTeam(gameState.winnerTeam);
                setShowImageOverlay(gameState.showImageOverlay || false);
                setCurrentImageUrl(gameState.currentImageUrl || null);
                setTimersExpanded(gameState.timersExpanded || false);

                // ── Bonus/tiebreaker questions and Bottoms Up round progress ──
                // These used to be left out of this restore, so rejoining as host (or resuming) in the
                // middle of a bonus round gave the host's screen NO question at all: the answer bar
                // silently did nothing, and the host then overwrote the saved copy with that empty
                // question too. The Stream screen already restores these same fields from Firebase,
                // so now the host does as well.
                setShowDistances(gameState.showDistances || false);
                setShootoutBoxExpanded(gameState.shootoutBoxExpanded || false);
                setShootoutComplete(gameState.shootoutComplete || false);
                setShootoutSecondBoardPending(gameState.shootoutSecondBoardPending || false);
                setSelectedShootoutQuestion(gameState.selectedShootoutQuestion ?? null);
                setSelectedTieBreakerShootoutQuestion(gameState.selectedTieBreakerShootoutQuestion ?? null);
                setUsedShootoutColIndices(gameState.usedShootoutColIndices || []);
                setUsedBottomsUpTexts(gameState.usedBottomsUpTexts || []);
                if (gameState.closestToQuestions && gameState.closestToQuestions.length > 0) setClosestToQuestions(gameState.closestToQuestions);
                if (gameState.closestToBase !== undefined) { setClosestToBase(gameState.closestToBase || 0); setClosestToConsumed(gameState.closestToConsumed || 0); }
                setDoubleDipSecondGuess(gameState.doubleDipSecondGuess || false);
                setDoubleDipTeam(gameState.doubleDipTeam ?? null);
                setDoubleDipActive(gameState.doubleDipActive || false);

                setBottomsUpQuestion(gameState.bottomsUpQuestion ?? null);
                setTieBreakerBottomsUpQuestion(gameState.tieBreakerBottomsUpQuestion ?? null);
                setBottomsUpTurnNumber(gameState.bottomsUpTurnNumber ?? 1);
                setBottomsUpActiveTeam(gameState.bottomsUpActiveTeam || 1);
                setBottomsUpUsedAnswers(gameState.bottomsUpUsedAnswers || []);
                // A turn that was frozen mid-popup or mid-score-animation can't be resumed exactly
                // (the animation's timers are gone), so it's put back at the nearest safe spot:
                // the answer popup goes back to "type the answer", the animation goes to "between turns".
                const savedBottomsUpPhase = gameState.bottomsUpPhase || 'question';
                setBottomsUpPhase(savedBottomsUpPhase === 'modal' ? 'input' : savedBottomsUpPhase === 'animating' ? 'between' : savedBottomsUpPhase);
                setBottomsUpAnimating(false);
                setBottomsUpAnimationValue(0);
                setBottomsUpShowAnswer(false);
                setBottomsUpFlyingScore(false);
                setBottomsUpGlowing(false);
                setBottomsUpConfirmedAnswer(null);
                setBottomsUpShowModal(false);
                setBottomsUpHostInput('');

                setTeamRecords(gameState.teamRecords || {});
                if (gameState.seriesInfo) {
                    setSeasonType(gameState.seriesInfo.seasonType || 'regular');
                    setTotalMatches(gameState.seriesInfo.totalMatches || 1);
                    setSeriesMatchIndex(gameState.seriesInfo.matchIndex || 0);
                    setSeriesWins(gameState.seriesInfo.wins || {});
                    setSeriesRecorded(gameState.seriesInfo.recorded || []);
                    setSeriesOrder(Array.isArray(gameState.seriesInfo.order) ? gameState.seriesInfo.order : Object.values(gameState.seriesInfo.order || {}));
                    setPlayoffNoticeDismissed(!!gameState.seriesInfo.noticeDismissed);
                }

                setTeamsConfirmed(true);
                setShowIntro(false);
                setIntroStep(5);
                setGameStarted(true);
                setIsConnected(true);
                setShowRoomSetup(false);
                setShowRoomCheckModal(false);
            };

            // Renders question text with [bracketed] host-only content
            // Host sees bracketed content in cyan italic, Stream sees it removed
            const renderQuestionText = (text, isHost) => {
                if (!text) return '';
                if (!text.includes('[')) return text;
                
                // Split on bracket patterns
                const parts = text.split(/(\[[^\]]*\])/g);
                
                if (!isHost) {
                    // Stream: remove bracketed sections entirely
                    return parts
                        .filter(part => !part.startsWith('['))
                        .join('')
                        .replace(/\s+/g, ' ')
                        .trim();
                }
                
                // Host: render bracketed sections in cyan italic
                return parts.map((part, index) => {
                    if (part.startsWith('[') && part.endsWith(']')) {
                        return (
                            <span key={index} style={{
                                display: 'block',
                                color: '#22d3ee',
                                fontStyle: 'italic',
                                marginTop: '2em'
                            }}>
                                {part.slice(1, -1)}
                            </span>
                        );
                    }
                    return part;
                });
            };

            // Converts a Google Drive sharing URL to a direct image URL
            const convertDriveUrl = (url) => {
                if (!url) return null;
                
                // Already a direct URL - return as is
                if (url.includes('lh3.googleusercontent.com')) return url;
                
                // Extract the file ID from a standard sharing URL
                // Format: https://drive.google.com/file/d/FILE_ID/view
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
                
                // If we can't parse it, return the original URL and hope for the best
                return url;
            };

            // Mark a bonus/tiebreaker question as used in Google Sheets
            const markQuestionUsed = async (tabName, matchName, row = null, col = null) => {
                try {
                    const body = { tabName, matchName, team1Name: selectedTeam1?.name || '', team2Name: selectedTeam2?.name || '' };
                    if (row) body.row = row;
                    if (col !== null) body.col = col;
                    console.log('markQuestionUsed called:', JSON.stringify(body));
                    const response = await fetch(
                        'https://us-central1-hometowns-trivia-league.cloudfunctions.net/markQuestionUsed',
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        }
                    );
                    
                    const result = await response.json();
                    console.log('✅ Marked question as used:', result.message);
                } catch (error) {
                    console.error('❌ Error marking question as used:', error);
                }
            };

            // Check if a room code already exists in Firebase before connecting
            const checkRoomCode = async () => {
